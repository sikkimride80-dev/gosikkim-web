<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rai Electronics - Flagship Experience</title>
    <style>
        :root {
            --accent-gold: #ffd700;
            --accent-cyan: #00f3ff;
            --net-color: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Scattered Funny Stickers in Outside Black Zones */
        .sticker {
            position: absolute;
            font-size: 26px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.9;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9));
            animation: floatSticker 3s ease-in-out infinite alternate;
        }

        @keyframes floatSticker {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-5px) scale(1.08); }
        }

        .s1 { top: 60px; left: 8%; animation-delay: 0s; }
        .s2 { top: 75px; right: 10%; animation-delay: 0.3s; }
        .s3 { top: 120px; left: 3%; animation-delay: 0.6s; }
        .s4 { top: 130px; right: 4%; animation-delay: 0.9s; }
        .s5 { top: 56%; left: 4%; animation-delay: 0.5s; }
        .s6 { top: 52%; right: 2%; animation-delay: 0.8s; }
        .s7 { bottom: 130px; left: 6%; animation-delay: 1.1s; }
        .s8 { bottom: 140px; right: 8%; animation-delay: 0.4s; }

        /* Animated Alive Character Photo Frame */
        .center-bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: url('https://files.catbox.moe/lcxrp2.jpg') no-repeat center center;
            background-size: contain;
            z-index: 5;
            pointer-events: none;
            will-change: transform;
            animation: characterBounceTurn 5s ease-in-out infinite;
        }

        @keyframes characterBounceTurn {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
            25% {
                transform: translate(-50%, -51%) scale(1.025) rotate(-1.2deg);
            }
            50% {
                transform: translate(-50%, -49.5%) scale(1.035) rotate(0.8deg);
            }
            75% {
                transform: translate(-50%, -50.5%) scale(1.015) rotate(-0.5deg);
            }
        }

        /* Top and Bottom Containers */
        .top-section {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .bottom-section {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 4px 12px 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: auto; /* Pushes text below image frame */
        }

        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        /* TV Antenna Live Signal Widget with 4-Bar Waves & Side-to-Side Motion */
        .radar-widget {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 15, 15, 0.9);
            padding: 3px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 11px;
            font-weight: 700;
        }

        .antenna-container {
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: bottom center;
            animation: sweepSideToSide 2s ease-in-out infinite alternate;
        }

        @keyframes sweepSideToSide {
            0% { transform: rotate(-20deg); }
            100% { transform: rotate(20deg); }
        }

        .signal-canvas {
            width: 24px;
            height: 20px;
            display: block;
        }

        .lang-select {
            background: rgba(15, 15, 15, 0.9);
            color: var(--accent-gold);
            border: 1px solid rgba(255, 215, 0, 0.7);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .lang-select option {
            background: #000000;
            color: #ffffff;
        }

        .header-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .gate-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.85);
            transition: opacity 0.3s ease;
        }

        .go-btn {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff0055, #00f3ff);
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            border: 2px solid #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            transition: transform 0.2s ease;
        }

        .go-btn:active {
            transform: scale(0.92);
        }

        .text-top-container {
            font-size: 14px;
            font-weight: 800;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--accent-gold);
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
        }

        .text-bottom-container {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.3;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 8px;
            border-radius: 8px;
        }

        @keyframes smoothLineReveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 6px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .intro-line {
            opacity: 0;
            will-change: transform, opacity;
            animation: smoothLineReveal 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            margin-bottom: 2px;
            color: #ffffff;
            text-shadow: 0 2px 6px #000000;
        }

        .founder-line {
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.7);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ff0055 50%, #00f3ff 100%);
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 12px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .lang-btn {
            background: rgba(20, 20, 20, 0.95);
            border: 1.5px solid var(--accent-gold);
            color: #ffffff;
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 6px;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <!-- Scattered Funny Stickers in Outside Black Zones -->
    <div class="sticker s1">🤪</div>
    <div class="sticker s2">😂</div>
    <div class="sticker s3">⚡</div>
    <div class="sticker s4">⭐</div>
    <div class="sticker s5">🤡</div>
    <div class="sticker s6">😎</div>
    <div class="sticker s7">🔥</div>
    <div class="sticker s8">🚀</div>

    <!-- Central Background Image with Live Motion -->
    <div class="center-bg-image"></div>

    <!-- 1. GO Gate -->
    <div id="go-gate" class="gate-overlay">
        <div class="top-section">
            <div class="header-title">🔌 RAI ELECTRONICS</div>
        </div>
        <div class="bottom-section">
            <button class="go-btn" onclick="pressGo()">GO</button>
        </div>
    </div>

    <!-- 2. Language Gate -->
    <div id="lang-gate" class="gate-overlay hidden">
        <div class="top-section">
            <div class="header-title">Select Language</div>
        </div>
        <div class="bottom-section" style="max-width: 280px;">
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('ne')">नेपाली (Nepali)</button>
            <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी (Hindi)</button>
        </div>
    </div>

    <!-- 3. Dashboard Interface -->
    <div class="top-section">
        <div class="header-bar">
            <!-- TV Antenna Sweeping Side-to-Side with 4-Bar Signal Canvas -->
            <div class="radar-widget">
                <div class="antenna-container">
                    <canvas id="signalCanvas" class="signal-canvas" width="24" height="20"></canvas>
                </div>
                <span id="radarText" style="color: var(--net-color);">4G: FAST</span>
            </div>
            
            <select id="switcher" class="lang-select" onchange="switchAppLanguage(this.value)">
                <option value="en">English</option>
                <option value="ne">नेपाली</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>
        <div id="text-top-output" class="text-top-container"></div>
    </div>

    <div class="bottom-section">
        <div id="text-bottom-output" class="text-bottom-container"></div>
        <button class="btn-action hidden" id="btn-next-step" onclick="alert(translations[currentLang].alertText)">Enter Rai Electronics 🚀</button>
    </div>

<script>
    const translations = {
        en: {
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Step 1 Complete! Ready for Step 2.",
            topLines: ["Welcome to Rai Electronics"],
            bottomLines: [
                "We offer you the most discounted prices",
                "You can buy every electronic item here",
                "Please Enjoy Your Visit",
                "🌹 🙏 Founder : Uttam Rai 🙏 🌹"
            ]
        },
        ne: {
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "चरण १ पूरा भयो! चरण २ का लागि तयार।",
            topLines: ["राई इलेक्ट्रोनिक्समा स्वागत छ"],
            bottomLines: [
                "हामी तपाईंलाई सहुलियत मूल्यमा सामान दिन्छौं",
                "तपाईं यहाँ सबै इलेक्ट्रोनिक सामान किन्न सक्नुहुन्छ",
                "कृपया तपाईंको भ्रमणको आनन्द लिनुहोस्",
                "🌹 🙏 संस्थापक : उत्तम राई 🙏 🌹"
            ]
        },
        hi: {
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "चरण 1 पूर्ण! चरण 2 के लिए तैयार।",
            topLines: ["राई इलेक्ट्रॉनिक्स में स्वागत है"],
            bottomLines: [
                "हम आपको सबसे अच्छी छूट पर सामान देते हैं",
                "आप यहाँ हर इलेक्ट्रॉनिक आइटम खरीद सकते हैं",
                "कृपया अपनी यात्रा का आनंद लें",
                "🌹 🙏 संस्थापक : उत्तम राय 🙏 🌹"
            ]
        }
    };

    let currentLang = 'en';

    // TV Antenna with 4 Live Animated Signal Arcs & Speed Monitor
    function initNetworkAntenna() {
        const textElem = document.getElementById('radarText');
        const canvas = document.getElementById('signalCanvas');
        const ctx = canvas.getContext('2d');
        let pulseStep = 0;

        function checkSpeed() {
            let color = '#00ff66'; // Green
            let label = '4G: FAST';

            if (!navigator.onLine) {
                color = '#ff3333';
                label = 'OFFLINE';
            } else if (navigator.connection) {
                const conn = navigator.connection;
                const type = conn.effectiveType;
                if (conn.saveData || type === 'slow-2g' || type === '2g') {
                    color = '#ff3333';
                    label = 'POOR';
                } else if (type === '3g') {
                    color = '#ffd700';
                    label = 'AVG';
                } else {
                    color = '#00ff66';
                    label = '4G: FAST';
                }
            } else {
                label = '4G: FAST';
                color = '#00ff66';
            }

            textElem.innerText = label;
            textElem.style.color = color;
            document.documentElement.style.setProperty('--net-color', color);
        }

        // Draw Classic Antenna Base + 4 Wave Signal Arcs
        function drawSignalWaves() {
            ctx.clearRect(0, 0, 24, 20);
            const activeColor = getComputedStyle(document.documentElement).getPropertyValue('--net-color').trim() || '#00ff66';

            // TV Antenna Rabbit Ear V-Stems
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(8, 19);
            ctx.lineTo(12, 13);
            ctx.lineTo(16, 19);
            ctx.stroke();

            // Central Stand
            ctx.beginPath();
            ctx.moveTo(12, 19);
            ctx.lineTo(12, 11);
            ctx.stroke();

            // 4 Live Curved WiFi Signal Arcs above antenna head
            const radii = [3.5, 6, 8.5, 11];
            
            radii.forEach((r, idx) => {
                ctx.beginPath();
                ctx.arc(12, 11, r, Math.PI * 1.25, Math.PI * 1.75);
                
                let isActiveWave = (Math.floor(pulseStep) % 4) === idx;
                ctx.strokeStyle = isActiveWave ? '#ffffff' : activeColor;
                ctx.lineWidth = isActiveWave ? 2 : 1.2;
                ctx.globalAlpha = isActiveWave ? 1.0 : 0.6;
                ctx.stroke();
            });

            ctx.globalAlpha = 1.0;
            pulseStep += 0.08;
            requestAnimationFrame(drawSignalWaves);
        }

        checkSpeed();
        drawSignalWaves();

        setInterval(checkSpeed, 4000);
        if (navigator.connection) {
            navigator.connection.addEventListener('change', checkSpeed);
        }
        window.addEventListener('online', checkSpeed);
        window.addEventListener('offline', checkSpeed);
    }

    window.addEventListener('DOMContentLoaded', initNetworkAntenna);

    function pressGo() {
        let goGate = document.getElementById('go-gate');
        goGate.classList.add('hidden');

        setTimeout(() => {
            let savedLang = localStorage.getItem('rai_preferred_lang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                document.getElementById('switcher').value = currentLang;
                startExperience();
            } else {
                document.getElementById('lang-gate').classList.remove('hidden');
            }
        }, 200);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        let langGate = document.getElementById('lang-gate');
        langGate.classList.add('hidden');

        setTimeout(() => {
            startExperience();
        }, 200);
    }

    function switchAppLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        startExperience();
    }

    function startExperience() {
        let topContainer = document.getElementById('text-top-output');
        let bottomContainer = document.getElementById('text-bottom-output');
        let btn = document.getElementById('btn-next-step');
        
        topContainer.innerHTML = "";
        bottomContainer.innerHTML = "";
        btn.classList.add('hidden');
        btn.innerText = translations[currentLang].btnText;

        let topLines = translations[currentLang].topLines;
        let bottomLines = translations[currentLang].bottomLines;

        topLines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = 'intro-line';
            div.style.color = '#ffd700';
            div.innerText = lineText;
            div.style.animationDelay = `${index * 0.15}s`;
            topContainer.appendChild(div);
        });

        bottomLines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = index === bottomLines.length - 1 ? 'intro-line founder-line' : 'intro-line';
            div.innerText = lineText;
            div.style.animationDelay = `${(topLines.length + index) * 0.15}s`;
            bottomContainer.appendChild(div);
        });

        let totalTimeMs = ((topLines.length + bottomLines.length) * 150) + 150;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
