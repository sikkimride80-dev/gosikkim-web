<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoSikkim — Partner Onboarding & KYC</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-hover: #115e59;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-top: 12px;
    }

    .badge {
      display: inline-block;
      background: #ccfbf1;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 20px 0;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      letter-spacing: 1px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .skip-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .skip-box input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .skip-box span {
      font-size: 13.5px;
      font-weight: 500;
    }

    /* Live Camera Section */
    .camera-section {
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      background: #fafafa;
    }

    .camera-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .camera-header strong {
      font-size: 14px;
    }

    .status-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e2e8f0;
      color: var(--muted);
      font-weight: 600;
    }

    .status-pill.captured {
      background: #dcfce7;
      color: var(--success);
    }

    video, img.preview {
      width: 100%;
      border-radius: 8px;
      background: #000;
      display: none;
      max-height: 220px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 14px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-cam {
      background: #e2e8f0;
      color: var(--text);
      width: 100%;
    }

    .btn-cam:hover {
      background: #cbd5e1;
    }

    .btn-snap {
      background: var(--primary);
      color: #fff;
      width: 100%;
      display: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      display: none;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <span class="badge">Step 2 of 3 • Partner KYC</span>
  <h1>Verify Your Identity</h1>
  <p class="subtitle">Google account verified. Enter your Aadhaar and PAN details below to activate your GoSikkim partner profile.</p>

  <!-- Form configured with standard Web3Forms action -->
  <form action="https://api.web3forms.com/submit" method="POST" id="kycForm">
    <!-- Web3Forms Access Key & Config fields -->
    <input type="hidden" name="access_key" value="1eff40e0-872f-45bb-b6ea-284e5a16dcde">
    <input type="hidden" name="subject" value="New GoSikkim Partner KYC Pending Approval">
    <input type="hidden" name="KYC_Status" value="Pending Manual Approval">

    <!-- Aadhaar Number -->
    <div class="form-group">
      <label for="aadhaarInput">Aadhaar Card Number *</label>
      <input 
        type="text" 
        name="Aadhaar_Number"
        id="aadhaarInput" 
        inputmode="numeric" 
        maxlength="14" 
        placeholder="XXXX XXXX XXXX" 
        required 
      />
    </div>

    <!-- PAN Number -->
    <div class="form-group">
      <label for="panInput">PAN Card Number *</label>
      <input 
        type="text" 
        name="PAN_Number"
        id="panInput" 
        maxlength="10" 
        placeholder="ABCDE1234F" 
        style="text-transform: uppercase;" 
        required 
      />
    </div>

    <!-- Skip Live Capture Option -->
    <label class="skip-box" for="skipCaptureCheckbox">
      <input type="checkbox" name="Live_Capture_Skipped" value="Yes" id="skipCaptureCheckbox" />
      <span>Skip live document photo capture for now (Numbers only)</span>
    </label>

    <!-- Live Capture Modules Wrapper -->
    <div id="liveCaptureWrapper">
      <!-- Live Aadhaar Capture -->
      <div class="camera-section" id="aadhaarCamBox">
        <div class="camera-header">
          <strong>1. Live Aadhaar Card Photo</strong>
          <span class="status-pill" id="aadhaarStatus">Not Captured</span>
        </div>
        <video id="aadhaarVideo" autoplay playsinline></video>
        <img id="aadhaarPreview" class="preview" alt="Captured Aadhaar" />
        <canvas id="aadhaarCanvas" style="display:none;"></canvas>
        <div class="btn-row">
          <button type="button" class="btn-cam" id="startAadhaarCam" onclick="startCamera('aadhaar')">Open Camera</button>
          <button type="button" class="btn-snap" id="snapAadhaarBtn" onclick="capturePhoto('aadhaar')">Capture Photo</button>
        </div>
      </div>

      <!-- Live PAN Capture -->
      <div class="camera-section" id="panCamBox">
        <div class="camera-header">
          <strong>2. Live PAN Card Photo</strong>
          <span class="status-pill" id="panStatus">Not Captured</span>
        </div>
        <video id="panVideo" autoplay playsinline></video>
        <img id="panPreview" class="preview" alt="Captured PAN" />
        <canvas id="panCanvas" style="display:none;"></canvas>
        <div class="btn-row">
          <button type="button" class="btn-cam" id="startPanCam" onclick="startCamera('pan')">Open Camera</button>
          <button type="button" class="btn-snap" id="snapPanBtn" onclick="capturePhoto('pan')">Capture Photo</button>
        </div>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Save & Continue</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
</div>

<script>
  const aadhaarInput = document.getElementById('aadhaarInput');
  const panInput = document.getElementById('panInput');
  const skipCheckbox = document.getElementById('skipCaptureCheckbox');
  const liveCaptureWrapper = document.getElementById('liveCaptureWrapper');
  const errorMsg = document.getElementById('errorMsg');

  let streams = { aadhaar: null, pan: null };

  // 1. Auto-format Aadhaar (XXXX XXXX XXXX)
  aadhaarInput.addEventListener('input', (e) => {
    let digits = e.target.value.replace(/\D/g, '').substring(0, 12);
    let formatted = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
    e.target.value = formatted;
  });

  // 2. Auto-capitalize PAN
  panInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 10);
  });

  // 3. Toggle Live Capture Visibility
  skipCheckbox.addEventListener('change', (e) => {
    if (e.target.checked) {
      liveCaptureWrapper.style.display = 'none';
      stopCamera('aadhaar');
      stopCamera('pan');
    } else {
      liveCaptureWrapper.style.display = 'block';
    }
    errorMsg.style.display = 'none';
  });

  // 4. Open Live Rear Camera
  async function startCamera(type) {
    errorMsg.style.display = 'none';
    const otherType = type === 'aadhaar' ? 'pan' : 'aadhaar';
    stopCamera(otherType);

    const video = document.getElementById(`${type}Video`);
    const preview = document.getElementById(`${type}Preview`);
    const startBtn = document.getElementById(`start${capitalize(type)}Cam`);
    const snapBtn = document.getElementById(`snap${capitalize(type)}Btn`);

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      streams[type] = stream;
      video.srcObject = stream;
      video.style.display = 'block';
      preview.style.display = 'none';
      startBtn.style.display = 'none';
      snapBtn.style.display = 'block';
    } catch (err) {
      showError('Camera access denied or unavailable. Check permissions or check "Skip live capture".');
    }
  }

  // 5. Capture Frame
  function capturePhoto(type) {
    const video = document.getElementById(`${type}Video`);
    const canvas = document.getElementById(`${type}Canvas`);
    const preview = document.getElementById(`${type}Preview`);
    const statusPill = document.getElementById(`${type}Status`);
    const startBtn = document.getElementById(`start${capitalize(type)}Cam`);
    const snapBtn = document.getElementById(`snap${capitalize(type)}Btn`);

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
    
    let hiddenImgInput = document.getElementById(`${type}_hidden_img`);
    if (!hiddenImgInput) {
      hiddenImgInput = document.createElement('input');
      hiddenImgInput.type = 'hidden';
      hiddenImgInput.name = `${capitalize(type)}_Photo_Data`;
      hiddenImgInput.id = `${type}_hidden_img`;
      document.getElementById('kycForm').appendChild(hiddenImgInput);
    }
    hiddenImgInput.value = dataUrl;

    preview.src = dataUrl;
    preview.style.display = 'block';
    video.style.display = 'none';

    statusPill.textContent = 'Captured ✓';
    statusPill.classList.add('captured');

    snapBtn.style.display = 'none';
    startBtn.textContent = 'Retake Photo';
    startBtn.style.display = 'block';

    stopCamera(type);
  }

  function stopCamera(type) {
    if (streams[type]) {
      streams[type].getTracks().forEach(track => track.stop());
      streams[type] = null;
    }
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  // 6. Frontend Validation Before Submission
  document.getElementById('kycForm').addEventListener('submit', (e) => {
    errorMsg.style.display = 'none';
    const rawAadhaar = aadhaarInput.value.replace(/\s/g, '');
    const pan = panInput.value.trim();

    if (!/^\d{12}$/.test(rawAadhaar)) {
      e.preventDefault();
      return showError('Please enter a valid 12-digit Aadhaar number.');
    }

    if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan)) {
      e.preventDefault();
      return showError('Please enter a valid 10-character PAN number (e.g., ABCDE1234F).');
    }
  });
</script>

</body>
</html>
