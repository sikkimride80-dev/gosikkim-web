<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikkim Daily Hour - 3D Real Object</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050509;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            perspective: 1000px;
        }

        /* Interactive 3D Stage */
        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            cursor: grab;
        }

        .stage:active {
            cursor: grabbing;
        }

        /* The 3D Realistic Object Monolith */
        .object-3d {
            position: relative;
            width: 340px;
            height: 520px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #020617 100%);
            border-radius: 28px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-style: preserve-3d;
            transform: rotateX(15deg) rotateY(-20deg);
            box-shadow: 
                -20px 30px 50px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(255, 255, 255, 0.3),
                inset 0 -5px 15px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.1s ease-out;
            user-select: none;
        }

        /* Glossy Light Reflection */
        .object-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            pointer-events: none;
            z-index: 5;
        }

        /* 3D Depth Layers */
        .layer-back {
            transform: translateZ(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #64748b;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .layer-content {
            transform: translateZ(45px);
            text-align: center;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 
                0 1px 0 #cbd5e1,
                0 2px 0 #94a3b8,
                0 3px 0 #64748b,
                0 4px 0 #475569,
                0 15px 25px rgba(0,0,0,0.9),
                0 0 30px rgba(59, 130, 246, 0.5);
        }

        .brand-title span {
            color: #38bdf8;
            text-shadow: 
                0 1px 0 #bae6fd,
                0 2px 0 #7dd3fc,
                0 3px 0 #38bdf8,
                0 4px 0 #0284c7,
                0 15px 25px rgba(0,0,0,0.9),
                0 0 35px rgba(56, 189, 248, 0.8);
        }

        /* Realistic Image Frame Inside The Box */
        .inner-image-box {
            transform: translateZ(30px);
            width: 100%;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .inner-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.1);
        }

        .layer-bottom {
            transform: translateZ(25px);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .action-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }
    </style>
</head>
<body>

    <div class="stage" id="stage">
        <div class="object-3d" id="object3d">
            <div class="layer-back">
                <span>No Limit</span>
                <div class="live-dot"></div>
            </div>
            
            <div class="layer-content">
                <div class="brand-title">
                    Sikkim<br>
                    <span>Daily Hour</span>
                </div>
            </div>

            <!-- Image inserted inside the box showing walking people, street, sunset, distant city and hills -->
            <div class="inner-image-box">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="People walking on street, sunset, hills and city view">
            </div>

            <div class="layer-bottom">
                <button class="action-btn" onclick="event.stopPropagation(); alert('Sikkim Daily Hour: Active & Unbounded.');">Initialize</button>
            </div>
        </div>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const object3d = document.getElementById('object3d');

        let isDragging = false;
        let startX, startY;
        let rotX = 15;
        let rotY = -20;

        stage.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            stage.setPointerCapture(e.pointerId);
        });

        stage.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            rotY += deltaX * 0.5;
            rotX -= deltaY * 0.5;
            
            object3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            startX = e.clientX;
            startY = e.clientY;
        });

        stage.addEventListener('pointerup', (e) => {
            isDragging = false;
            stage.releasePointerCapture(e.pointerId);
        });
    </script>
</body>
</html>
