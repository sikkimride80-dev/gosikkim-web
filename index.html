<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rai Electronics - Flagship Experience</title>
    <style>
        :root {
            --accent-gold: #ffd700;
            --accent-cyan: #00f3ff;
            --net-color: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Fixed Background Image in Screen Center */
        .center-bg-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: url('https://files.catbox.moe/lcxrp2.jpg') no-repeat center center;
            background-size: contain;
            z-index: 1;
            pointer-events: none;
        }

        /* Positioned right above and below the image edges */
        .top-section {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 4px 12px 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .bottom-section {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 0 12px 4px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Top Header & Radar Bar */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        /* Live Radar Antenna Widget */
        .radar-widget {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(10, 10, 10, 0.85);
            padding: 3px 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .radar-canvas {
            width: 16px;
            height: 16px;
        }

        .lang-select {
            background: rgba(10, 10, 10, 0.85);
            color: var(--accent-gold);
            border: 1px solid rgba(255, 215, 0, 0.6);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .lang-select option {
            background: #000000;
            color: #ffffff;
        }

        .header-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* GO Gate Overlay */
        .gate-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            transition: opacity 0.3s ease;
        }

        .go-btn {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff0055, #00f3ff);
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            border: 2px solid #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            transition: transform 0.2s ease;
        }

        .go-btn:active {
            transform: scale(0.92);
        }

        /* Tightened Text Container Styles */
        .text-top-container {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.2;
            min-height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--accent-gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .text-bottom-container {
            font-size: 14px;
            font-weight: 800;
            line-height: 1.3;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes smoothLineReveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 6px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .intro-line {
            opacity: 0;
            will-change: transform, opacity;
            animation: smoothLineReveal 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            margin-bottom: 2px;
            color: #ffffff;
            text-shadow: 0 2px 6px #000000;
        }

        .founder-line {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ff0055 50%, #00f3ff 100%);
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 12px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .lang-btn {
            background: rgba(10, 10, 10, 0.9);
            border: 1.5px solid var(--accent-gold);
            color: #ffffff;
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 4px;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <!-- Central Image (Unblocked) -->
    <div class="center-bg-image"></div>

    <!-- 1. GO Gate -->
    <div id="go-gate" class="gate-overlay">
        <div class="top-section">
            <div class="header-title">🔌 RAI ELECTRONICS</div>
        </div>
        <div class="bottom-section">
            <button class="go-btn" onclick="pressGo()">GO</button>
        </div>
    </div>

    <!-- 2. Language Gate -->
    <div id="lang-gate" class="gate-overlay hidden">
        <div class="top-section">
            <div class="header-title" style="font-size: 16px;">Select Language</div>
        </div>
        <div class="bottom-section" style="max-width: 280px;">
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('ne')">नेपाली (Nepali)</button>
            <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी (Hindi)</button>
        </div>
    </div>

    <!-- 3. Dashboard Interface -->
    <div class="top-section">
        <div class="header-bar">
            <!-- Live Satellite Network Radar Widget -->
            <div class="radar-widget">
                <canvas id="radarCanvas" class="radar-canvas" width="16" height="16"></canvas>
                <span id="radarText" style="color: var(--net-color);">4G: OK</span>
            </div>
            
            <select id="switcher" class="lang-select" onchange="switchAppLanguage(this.value)">
                <option value="en">English</option>
                <option value="ne">नेपाली</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>
        <div id="text-top-output" class="text-top-container"></div>
    </div>

    <div class="bottom-section">
        <div id="text-bottom-output" class="text-bottom-container"></div>
        <button class="btn-action hidden" id="btn-next-step" onclick="alert(translations[currentLang].alertText)">Enter Rai Electronics 🚀</button>
    </div>

<script>
    const translations = {
        en: {
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Step 1 Complete! Ready for Step 2.",
            topLines: ["Welcome to Rai Electronics"],
            bottomLines: [
                "We offer you the most discounted prices",
                "You can buy every electronic item here",
                "Please Enjoy Your Visit",
                "🌹 🙏 Founder : Uttam Rai 🙏 🌹"
            ]
        },
        ne: {
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "चरण १ पूरा भयो! चरण २ का लागि तयार।",
            topLines: ["राई इलेक्ट्रोनिक्समा स्वागत छ"],
            bottomLines: [
                "हामी तपाईंलाई सहुलियत मूल्यमा सामान दिन्छौं",
                "तपाईं यहाँ सबै इलेक्ट्रोनिक सामान किन्न सक्नुहुन्छ",
                "कृपया तपाईंको भ्रमणको आनन्द लिनुहोस्",
                "🌹 🙏 संस्थापक : उत्तम राई 🙏 🌹"
            ]
        },
        hi: {
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "चरण 1 पूर्ण! चरण 2 के लिए तैयार।",
            lines: [
                "राई इलेक्ट्रॉनिक्स में स्वागत है"
            ],
            topLines: ["राई इलेक्ट्रॉनिक्स में स्वागत है"],
            bottomLines: [
                "हम आपको सबसे अच्छी छूट पर सामान देते हैं",
                "आप यहाँ हर इलेक्ट्रॉनिक आइटम खरीद सकते हैं",
                "कृपया अपनी यात्रा का आनंद लें",
                "🌹 🙏 संस्थापक : उत्तम राय 🙏 🌹"
            ]
        }
    };

    let currentLang = 'en';

    // Live Satellite Network Radar Simulation & Connection Detection
    function initNetworkRadar() {
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const textElem = document.getElementById('radarText');
        let angle = 0;

        function updateNetworkStatus() {
            let label = '4G: FAST';
            let color = '#00ff66'; // Green

            if (navigator.connection) {
                const conn = navigator.connection;
                if (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g') {
                    label = 'POOR';
                    color = '#ff3333'; // Red
                } else if (conn.effectiveType === '3g') {
                    label = 'AVG';
                    color = '#ffd700'; // Yellow
                }
            }
            textElem.innerText = label;
            textElem.style.color = color;
            document.documentElement.style.setProperty('--net-color', color);
        }

        updateNetworkStatus();
        if (navigator.connection) {
            navigator.connection.addEventListener('change', updateNetworkStatus);
        }

        function drawRadar() {
            ctx.clearRect(0, 0, 16, 16);
            
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--net-color');
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(8, 8, 6.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(8, 8);
            ctx.lineTo(8 + 6.5 * Math.cos(angle), 8 + 6.5 * Math.sin(angle));
            ctx.stroke();

            angle += 0.15;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    }

    window.addEventListener('DOMContentLoaded', initNetworkRadar);

    function pressGo() {
        let goGate = document.getElementById('go-gate');
        goGate.classList.add('hidden');

        setTimeout(() => {
            let savedLang = localStorage.getItem('rai_preferred_lang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                document.getElementById('switcher').value = currentLang;
                startExperience();
            } else {
                document.getElementById('lang-gate').classList.remove('hidden');
            }
        }, 200);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        let langGate = document.getElementById('lang-gate');
        langGate.classList.add('hidden');

        setTimeout(() => {
            startExperience();
        }, 200);
    }

    function switchAppLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        startExperience();
    }

    function startExperience() {
        let topContainer = document.getElementById('text-top-output');
        let bottomContainer = document.getElementById('text-bottom-output');
        let btn = document.getElementById('btn-next-step');
        
        topContainer.innerHTML = "";
        bottomContainer.innerHTML = "";
        btn.classList.add('hidden');
        btn.innerText = translations[currentLang].btnText;

        let topLines = translations[currentLang].topLines;
        let bottomLines = translations[currentLang].bottomLines;

        topLines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = 'intro-line';
            div.style.color = '#ffd700';
            div.innerText = lineText;
            div.style.animationDelay = `${index * 0.15}s`;
            topContainer.appendChild(div);
        });

        bottomLines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = index === bottomLines.length - 1 ? 'intro-line founder-line' : 'intro-line';
            div.innerText = lineText;
            div.style.animationDelay = `${(topLines.length + index) * 0.15}s`;
            bottomContainer.appendChild(div);
        });

        let totalTimeMs = ((topLines.length + bottomLines.length) * 150) + 150;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
