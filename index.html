                    ["हामी", "तपाईंलाई", "सबैभन्दा", "बढी", "छुट", "मूल्यहरू", "प्रदान", "गर्दछौं"],

                    ["कृपया", "तपाईंको", "भ्रमणको", "आनन्द", "लिनुहोस्"],
                    { 
                        type: "founder", 
                        items: [
                            { type: "icon", text: "🌹" },
                            { type: "icon", text: "🙏" },
                            { type: "word", text: "संस्थापक" },
                            { type: "word", text: ":" },
                            { type: "word", text: "उत्तम" },

                            { type: "icon", text: "🙏" },

                    }
                ]
            },
            hi: {
                btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
                alertText: "राई इलेक्ट्रॉनिक्स गेटवे में आपका स्वागत है!",
                lines: [
                    ["राई", "इलेक्ट्रॉनिक्स", "में", "आपका", "स्वागत", "है"],
                    ["हम", "आपको", "सबसे", "कम", "कीमत", "पर", "सामान", "प्रदान", "करते", "हैं"],
                    ["आप", "यहाँ", "हर", "इलेक्ट्रॉनिक", "सामान", "खरीद", "सकते", "हैं"],
                    ["कृपया", "अपनी", "यात्रा", "का", "आनंद", "लें"],
                    { 
                        type: "founder", 
                        items: [
                            { type: "icon", text: "🌹" },

                            { type: "word", text: "उत्तम" },
                            { type: "word", text: "राय" },
                            { type: "icon", text: "🙏" },
                            { type: "icon", text: "🌹" }
                        ]
                    }
                ]
            }
        };

        let currentLang = 'en';
        let animationTimeoutId = null;

        /* Step 1: Press GO Action */
        function pressGo() {
            const goGate = document.getElementById('go-gate');
            goGate.style.opacity = '0';
            
            setTimeout(() => { 
                goGate.classList.add('gate-hidden'); 

                // Check stored language preference
                const savedLang = localStorage.getItem('rai_preferred_lang');
                if (savedLang && translations[savedLang]) {
                    currentLang = savedLang;
                    document.getElementById('switcher').value = currentLang;
                    startExperience();
                } else {
                    const langGate = document.getElementById('lang-gate');
                    langGate.classList.remove('gate-hidden');
                    langGate.style.opacity = '1';
                }
            }, 350);
        }

        /* Step 2: Language Selection Action */
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('rai_preferred_lang', lang);
            document.getElementById('switcher').value = lang;
            
            const langGate = document.getElementById('lang-gate');
            langGate.style.opacity = '0';
            setTimeout(() => { 
                langGate.classList.add('gate-hidden'); 
                startExperience();
            }, 350);
        }

        /* Header Language Switcher Handler */
        function switchAppLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('rai_preferred_lang', lang);
            startExperience();
        }

        /* Step 3: Start Letter Rain Experience */
        function startExperience() {
            if (animationTimeoutId) {
                clearTimeout(animationTimeoutId);
            }

            const container = document.getElementById('rain-text-output');
            container.innerHTML = "";
            let globalIndex = 0;
            const dataLines = translations[currentLang].lines;

            dataLines.forEach((lineData, lineIndex) => {
                let itemsInLine = [];
                if (Array.isArray(lineData)) {
                    itemsInLine = lineData.map(w => ({ type: "word", text: w }));
                } else if (lineData.type === "founder") {
                    itemsInLine = lineData.items;
                }

                itemsInLine.forEach((item) => {
                    if (item.type === "icon") {
                        const iconSpan = document.createElement('span');
                        iconSpan.className = 'icon-item';
                        iconSpan.innerText = item.text;
                        iconSpan.style.animationDelay = `${globalIndex * 0.025}s`;
                        container.appendChild(iconSpan);
                        globalIndex++;
                    } else {
                        const wordInnerSpan = document.createElement('span');
                        wordInnerSpan.className = 'word-wrapper';
                        
                        const word = item.text;
                        for (let i = 0; i < word.length; i++) {
                            const char = word.charAt(i);
                            const charSpan = document.createElement('span');
                            charSpan.className = 'rain-char';
                            charSpan.innerText = char;
                            // Fast cascading stagger animation
                            charSpan.style.animationDelay = `${globalIndex * 0.025}s, ${globalIndex * 0.04}s`;
                            
                            wordInnerSpan.appendChild(charSpan);
                            globalIndex++;
                        }
                        container.appendChild(wordInnerSpan);
                    }
                });

                if (lineIndex < dataLines.length - 1) {
                    const br = document.createElement('div');
                    br.className = 'line-break';
                    container.appendChild(br);
                }
            });

            // Update Action Button Text and Schedule Graceful Fade In
            const btn = document.getElementById('btn-next-step');
            btn.innerText = translations[currentLang].btnText;
            btn.classList.add('hidden');
            btn.style.opacity = '0';

            const totalTimeMs = (globalIndex * 25) + 200;
            animationTimeoutId = setTimeout(() => {
                btn.classList.remove('hidden');
                setTimeout(() => {
                    btn.style.opacity = '1';
                }, 50);
            }, totalTimeMs);
        }

        function handleEnterClick() {
            const currentObj = translations[currentLang];
            // Display rich styled modal feedback or custom step handler
            const banner = document.createElement('div');
            banner.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[300] bg-yellow-400 text-black px-6 py-3 rounded-full font-black text-sm shadow-2xl tracking-wide flex items-center gap-2 border-2 border-white animate-bounce';
            banner.innerHTML = `<span>✨</span> ${currentObj.alertText}`;
            document.body.appendChild(banner);

            setTimeout(() => {
                banner.remove();
            }, 3000);
        }

        function initFloatingParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const particles = [];
            const particleCount = 45;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 0.5,
                    color: Math.random() > 0.5 ? 'rgba(255, 215, 0, ' : 'rgba(0, 243, 255, ',
                    alpha: Math.random() * 0.5 + 0.1,
                    vy: -(Math.random() * 0.4 + 0.1),
                    vx: (Math.random() - 0.5) * 0.2
                });
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;

                    if (p.y < 0) {
                        p.y = canvas.height;
                        p.x = Math.random() * canvas.width;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + p.alpha + ')';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color + '0.8)';
                    ctx.fill();
                });

                requestAnimationFrame(animateParticles);
            }

            animateParticles();
        }

        window.onload = function() {
            initFloatingParticles();
        };
    </script>
