<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rai Electronics - Flagship Experience</title>
    <style>
        :root {
            --accent-gold: #ffd700;
            --accent-cyan: #00f3ff;
            /* Fully transparent background to ensure background image is 100% clear */
            --glass-bg: rgba(0, 0, 0, 0.2);
            --glass-border: rgba(255, 215, 0, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Image set to CONTAIN so the full photo fits without cropping or zooming */
            background: #020008 url('https://files.catbox.moe/lcxrp2.jpg') no-repeat center center fixed;
            background-size: contain;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Fully transparent overlay layers with ZERO BLUR */
        .gate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        /* Minimalist Transparent Glass Card */
        .gate-card {
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid var(--glass-border);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .go-btn-wrapper {
            position: relative;
            margin-top: 25px;
        }

        .go-btn-glow {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffd700, #ff0055, #00f3ff);
            filter: blur(8px);
            opacity: 0.9;
        }

        .go-btn {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(9, 3, 23, 0.75);
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            border: 2px solid rgba(255, 215, 0, 0.9);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 2px;
            transition: transform 0.2s ease;
        }

        .go-btn:active {
            transform: scale(0.92);
        }

        /* Main Container Card - Completely Transparent */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            padding: 30px 18px;
            border-radius: 28px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            text-align: center;
            margin: 16px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(0, 0, 0, 0.75);
            color: var(--accent-gold);
            border: 1px solid rgba(255, 215, 0, 0.8);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .lang-select option {
            background: #090317;
            color: #ffffff;
        }

        /* High-Performance Text Container with Strong Shadow for Maximum Contrast */
        .text-container {
            font-size: 19px;
            font-weight: 800;
            line-height: 2.2;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes smoothLineReveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 15px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .intro-line {
            opacity: 0;
            will-change: transform, opacity;
            animation: smoothLineReveal 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 2px 8px #000000, 0 0 10px #000000, 0 0 12px rgba(255, 215, 0, 0.9);
        }

        .founder-line {
            color: #00f3ff;
            text-shadow: 0 2px 8px #000000, 0 0 10px #000000, 0 0 12px rgba(0, 243, 255, 0.9);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ff0055 50%, #00f3ff 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 215, 0, 0.85);
            color: #ffffff;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <!-- 1. Mandatory GO Gate -->
    <div id="go-gate" class="gate-overlay">
        <div class="gate-card">
            <div style="font-size: 26px; font-weight: 900; color: var(--accent-gold); text-shadow: 0 2px 8px #000;">🔌 RAI ELECTRONICS</div>
            <div style="font-size: 13px; color: var(--accent-cyan); margin-top: 6px; font-weight: 600; text-shadow: 0 2px 8px #000;">Flagship Digital Experience</div>
            
            <div class="go-btn-wrapper" onclick="pressGo()">
                <div class="go-btn-glow"></div>
                <button class="go-btn">GO</button>
            </div>
        </div>
    </div>

    <!-- 2. Language Gate -->
    <div id="lang-gate" class="gate-overlay hidden">
        <div class="gate-card" style="width: 100%; max-width: 320px;">
            <div style="font-size: 22px; font-weight: 900; color: var(--accent-gold); margin-bottom: 6px; text-shadow: 0 2px 8px #000;">Select Language</div>
            <div style="font-size: 13px; color: #00ff66; margin-bottom: 20px; font-weight: 600; text-shadow: 0 2px 8px #000;">कृपया भाषा चयन गर्नुहोस् / भाषा चुनें</div>
            
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('ne')">नेपाली (Nepali)</button>
            <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी (Hindi)</button>
        </div>
    </div>

    <!-- 3. Glassmorphism Application Frame -->
    <div class="app-container">
        <div class="top-bar">
            <select id="switcher" class="lang-select" onchange="switchAppLanguage(this.value)">
                <option value="en">English</option>
                <option value="ne">नेपाली</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>

        <div id="text-output" class="text-container"></div>
        <button class="btn-action hidden" id="btn-next-step" onclick="alert(translations[currentLang].alertText)">Enter Rai Electronics 🚀</button>
    </div>

<script>
    const translations = {
        en: {
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Step 1 Complete! Ready for Step 2.",
            lines: [
                "Welcome to Rai Electronics",
                "We offer you the most discounted prices",
                "You can buy every electronic item here",
                "Please Enjoy Your Visit",
                "🌹 🙏 Founder : Uttam Rai 🙏 🌹"
            ]
        },
        ne: {
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "चरण १ पूरा भयो! चरण २ का लागि तयार।",
            lines: [
                "राई इलेक्ट्रोनिक्समा स्वागत छ",
                "हामी तपाईंलाई सहुलियत मूल्यमा सामान दिन्छौं",
                "तपाईं यहाँ सबै इलेक्ट्रोनिक सामान किन्न सक्नुहुन्छ",
                "कृपया तपाईंको भ्रमणको आनन्द लिनुहोस्",
                "🌹 🙏 संस्थापक : उत्तम राई 🙏 🌹"
            ]
        },
        hi: {
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "चरण 1 पूर्ण! चरण 2 के लिए तैयार।",
            lines: [
                "राई इलेक्ट्रॉनिक्स में स्वागत है",
                "हम आपको सबसे अच्छी छूट पर सामान देते हैं",
                "आप यहाँ हर इलेक्ट्रॉनिक आइटम खरीद सकते हैं",
                "कृपया अपनी यात्रा का आनंद लें",
                "🌹 🙏 संस्थापक : उत्तम राय 🙏 🌹"
            ]
        }
    };

    let currentLang = 'en';

    function pressGo() {
        let goGate = document.getElementById('go-gate');
        goGate.classList.add('hidden');

        setTimeout(() => {
            let savedLang = localStorage.getItem('rai_preferred_lang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                document.getElementById('switcher').value = currentLang;
                startExperience();
            } else {
                document.getElementById('lang-gate').classList.remove('hidden');
            }
        }, 200);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        let langGate = document.getElementById('lang-gate');
        langGate.classList.add('hidden');

        setTimeout(() => {
            startExperience();
        }, 200);
    }

    function switchAppLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        startExperience();
    }

    function startExperience() {
        let container = document.getElementById('text-output');
        let btn = document.getElementById('btn-next-step');
        
        container.innerHTML = "";
        btn.classList.add('hidden');
        btn.innerText = translations[currentLang].btnText;

        let lines = translations[currentLang].lines;
        let fragment = document.createDocumentFragment();

        lines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = index === lines.length - 1 ? 'intro-line founder-line' : 'intro-line';
            div.innerText = lineText;
            div.style.animationDelay = `${index * 0.2}s`;
            fragment.appendChild(div);
        });

        container.appendChild(fragment);

        let totalTimeMs = (lines.length * 200) + 150;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
