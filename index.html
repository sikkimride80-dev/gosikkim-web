```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Electronics - Multilingual Cinematic Experience</title>
    <style>
        :root {
            --bg-deep: #050110;
            --glass-bg: rgba(15, 8, 35, 0.98);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1042, var(--bg-deep) 75%);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            padding: 35px 24px;
            border-radius: 32px;
            border: 3px solid #ffff00;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
            position: relative;
            text-align: center;
        }

        .header-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.12);
            color: #ffff00;
            border: 1.5px solid #ffff00;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .lang-select:hover {
            background: rgba(255, 255, 0, 0.2);
        }

        .rain-text-container {
            position: relative;
            z-index: 2;
            font-size: 20px;
            font-weight: 800;
            line-height: 2.2;
            max-width: 460px;
            margin: 0 auto;
            text-align: center;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .word-wrapper {
            display: inline-block;
            white-space: nowrap;
            margin-right: 6px;
        }

        .line-break {
            display: block;
            height: 12px;
            width: 100%;
        }

        @keyframes fastDrop {
            0% { 
                opacity: 0; 
                transform: translateY(-25px); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes colorFlickerFast {
            0% { color: #ffff00; }   /* Yellow */
            20% { color: #00ff66; }  /* Green */
            40% { color: #00ccff; }  /* Blue */
            60% { color: #ff3333; }  /* Red */
            80% { color: #ff9900; }  /* Orange */
            100% { color: #cc33ff; } /* Purple */
        }

        .rain-char {
            display: inline-block;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDrop 0.15s ease-out forwards, colorFlickerFast 0.8s infinite linear;
        }

        .icon-item {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDrop 0.15s ease-out forwards;
            font-size: 24px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ffff00, #ff0055);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 25px;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Language Overlay Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 1, 16, 0.98);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffff00;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 14px;
            color: #00ff66;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #ffff00;
            color: #ffffff;
            padding: 15px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .lang-btn:hover { 
            background: #ffff00; 
            color: #050110; 
            transform: scale(1.02);
        }

        .hidden { 
            display: none !important; 
        }
    </style>
</head>
<body>

<div id="lang-gate" class="modal-overlay">
    <div class="modal-title">🔌 Rai Electronics</div>
    <div class="modal-subtitle">Please select your preferred language / भाषा छान्नुहोस्</div>
    
    <div style="width: 100%; max-width: 320px;">
        <button class="lang-btn" onclick="selectLanguage('en')">English</button>
        <button class="lang-btn" onclick="selectLanguage('ne')">नेपाली (Nepali)</button>
        <button class="lang-btn" onclick="selectLanguage('hi')">हिन्दी (Hindi)</button>
    </div>
</div>

<div class="app-container">
    <div class="header-bar">
        <select id="switcher" class="lang-select" onchange="switchLanguage(this.value)">
            <option value="en" style="background:#050110;">English</option>
            <option value="ne" style="background:#050110;">नेपाली</option>
            <option value="hi" style="background:#050110;">हिन्दी</option>
        </select>
    </div>

    <div id="rain-text-output" class="rain-text-container"></div>
    <button class="btn hidden" id="btn-next-step" onclick="handleEnterStore()">Enter Rai Electronics 🚀</button>
</div>

<script>
    const translations = {
        en: {
            speech: "Welcome to Rai Electronics. We offer you the most discounted prices. You can buy every electronic item here. Please enjoy your visit. Founder Uttam Rai.",
            langCode: "en-US",
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Welcome to Rai Electronics Store!",
            lines: [
                ["Welcome", "to", "Rai", "Electronics"],
                ["We", "offer", "you", "the", "most", "discounted", "prices"],
                ["You", "can", "buy", "every", "electronic", "item", "here"],
                ["Please", "Enjoy", "Your", "Visit"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "Founder" }, { type: "word", text: ":" },
                    { type: "word", text: "Uttam" }, { type: "word", text: "Rai" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        },
        ne: {
            speech: "राई इलेक्ट्रोनिक्समा स्वागत छ। हामी तपाईंलाई सबैभन्दा बढी छुट मूल्यहरू प्रदान गर्दछौं। तपाईं यहाँ हरेक इलेक्ट्रोनिक सामान किन्न सक्नुहुन्छ। तपाईंको भ्रमणको आनन्द लिनुहोस्। संस्थापक उत्तम राई।",
            langCode: "ne-NP",
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "राई इलेक्ट्रोनिक्समा तपाईंलाई स्वागत छ!",
            lines: [
                ["राई", "इलेक्ट्रोनिक्समा", "स्वागत", "छ"],
                ["हामी", "तपाईंलाई", "सबैभन्दा", "बढी", "छुट", "दिन्छौं"],
                ["तपाईं", "यहाँ", "हरेक", "इलेक्ट्रोनिक", "सामान", "किन्न", "सक्नुहुन्छ"],
                ["कृपया", "तपाईंको", "भ्रमणको", "आनन्द", "लिनुहोस्"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "संस्थापक" }, { type: "word", text: ":" },
                    { type: "word", text: "उत्तम" }, { type: "word", text: "राई" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        },
        hi: {
            speech: "राई इलेक्ट्रॉनिक्स में आपका स्वागत है। हम आपको सबसे कम कीमत पर सामान प्रदान करते हैं। आप यहाँ हर इलेक्ट्रॉनिक सामान खरीद सकते हैं। कृपया अपनी यात्रा का आनंद लें। संस्थापक उत्तम राय।",
            langCode: "hi-IN",
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "राई इलेक्ट्रॉनिक्स में आपका स्वागत है!",
            lines: [
                ["राई", "इलेक्ट्रॉनिक्स", "में", "स्वागत", "है"],
                ["हम", "आपको", "सबसे", "कम", "कीमत", "पर", "सामान", "देते", "हैं"],
                ["आप", "यहाँ", "हर", "इलेक्ट्रॉनिक", "सामान", "खरीद", "सकते", "हैं"],
                ["कृपया", "अपनी", "यात्रा", "का", "आनंद", "लें"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "संस्थापक" }, { type: "word", text: ":" },
                    { type: "word", text: "उत्तम" }, { type: "word", text: "राय" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        }
    };

    let currentLang = 'en';

    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('rai_preferred_lang');
        if (savedLang && translations[savedLang]) {
            currentLang = savedLang;
            document.getElementById('lang-gate').style.display = 'none';
            document.getElementById('switcher').value = currentLang;
            startExperience();
        }
        
        // Warmup voices for Web Speech API
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
    });

    function selectLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        const gate = document.getElementById('lang-gate');
        gate.style.opacity = '0';
        setTimeout(() => { gate.style.display = 'none'; }, 300);

        startExperience();
    }

    function switchLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        startExperience();
    }

    function speakText(text, langCode) {
        if (!('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const primaryLang = langCode.split('-')[0];
        
        // Find best matching voice for current locale
        const matchedVoice = voices.find(v => v.lang === langCode || v.lang.startsWith(primaryLang));
        if (matchedVoice) {
            utterance.voice = matchedVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    function startExperience() {
        const textToSpeak = translations[currentLang].speech;
        const langCode = translations[currentLang].langCode;

        // Speak narration
        speakText(textToSpeak, langCode);

        // Build letter rain DOM elements
        const container = document.getElementById('rain-text-output');
        container.innerHTML = "";
        let globalIndex = 0;
        const dataLines = translations[currentLang].lines;

        dataLines.forEach((lineData, lineIndex) => {
            let wordsInLine = [];
            if (Array.isArray(lineData)) {
                wordsInLine = lineData.map(w => ({ type: "word", text: w }));
            } else if (lineData.type === "founder") {
                wordsInLine = lineData.items;
            }

            const lineDiv = document.createElement('div');
            lineDiv.style.marginBottom = "4px";

            wordsInLine.forEach((item) => {
                if (item.type === "icon") {
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'icon-item';
                    iconSpan.innerText = item.text;
                    iconSpan.style.animationDelay = `${globalIndex * 0.035}s`;
                    lineDiv.appendChild(iconSpan);
                    globalIndex++;
                } else {
                    const wordSpan = document.createElement('span');
                    wordSpan.className = 'word-wrapper';
                    
                    const word = item.text;
                    for (let i = 0; i < word.length; i++) {
                        const char = word.charAt(i);
                        const charSpan = document.createElement('span');
                        charSpan.className = 'rain-char';
                        charSpan.innerText = char;
                        charSpan.style.animationDelay = `${globalIndex * 0.035}s, ${globalIndex * 0.05}s`;
                        
                        wordSpan.appendChild(charSpan);
                        globalIndex++;
                    }
                    lineDiv.appendChild(wordSpan);
                }
            });

            container.appendChild(lineDiv);
        });

        // Configure timed entry button
        const btn = document.getElementById('btn-next-step');
        btn.innerText = translations[currentLang].btnText;
        btn.classList.add('hidden');

        const totalDropTimeMs = (globalIndex * 35) + 300;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalDropTimeMs);
    }

    function handleEnterStore() {
        const message = translations[currentLang].alertText;
        
        // Friendly modal confirmation without alert()
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div style="background: rgba(20, 10, 45, 0.95); border: 2px solid #00ff66; padding: 25px; border-radius: 20px; max-width: 300px; text-align: center;">
                <div style="font-size: 30px; margin-bottom: 10px;">⚡</div>
                <div style="font-weight: bold; font-size: 16px; color: #ffffff; margin-bottom: 15px;">${message}</div>
                <button class="btn" style="margin-top: 0; padding: 10px;" onclick="this.closest('.modal-overlay').remove()">OK</button>
            </div>
        `;
        document.body.appendChild(modal);
    }
</script>

</body>
</html>
