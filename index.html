<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rai Electronics - Flagship Experience</title>
    <style>
        :root {
            --accent-gold: #ffd700;
            --accent-cyan: #00f3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000 url('https://files.catbox.moe/lcxrp2.jpg') no-repeat center center fixed;
            background-size: contain;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .gate-overlay {
            position: fixed;
            inset: 0;
            background: transparent;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .gate-card {
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .watermark-title {
            font-size: 26px;
            font-weight: 900;
            color: rgba(255, 215, 0, 0.45);
            mix-blend-mode: overlay;
            text-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
        }

        .watermark-subtitle {
            font-size: 13px;
            color: rgba(0, 243, 255, 0.45);
            margin-top: 6px;
            font-weight: 600;
            mix-blend-mode: overlay;
        }

        .go-btn {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.25);
            color: rgba(255, 255, 255, 0.7);
            font-size: 26px;
            font-weight: 900;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 2px;
            margin-top: 25px;
            backdrop-filter: blur(2px);
            mix-blend-mode: overlay;
            transition: transform 0.2s ease;
        }

        .go-btn:active {
            transform: scale(0.92);
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: transparent;
            padding: 20px 16px;
            border: none;
            box-shadow: none;
            text-align: center;
            margin: 16px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 215, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .lang-select option {
            background: #000000;
            color: #ffffff;
        }

        .text-container {
            font-size: 19px;
            font-weight: 900;
            line-height: 2.2;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes smoothLineReveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 15px, 0);
            }
            100% {
                opacity: 0.38;
                transform: translate3d(0, 0, 0);
            }
        }

        .intro-line {
            opacity: 0;
            will-change: transform, opacity;
            animation: smoothLineReveal 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.38);
            mix-blend-mode: overlay;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
        }

        .founder-line {
            color: rgba(0, 243, 255, 0.55);
            mix-blend-mode: overlay;
        }

        .btn-action {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 16px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            mix-blend-mode: overlay;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: rgba(255, 255, 255, 0.7);
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            mix-blend-mode: overlay;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <!-- 1. GO Gate -->
    <div id="go-gate" class="gate-overlay">
        <div class="gate-card">
            <div class="watermark-title">🔌 RAI ELECTRONICS</div>
            <div class="watermark-subtitle">Flagship Digital Experience</div>
            
            <button class="go-btn" onclick="pressGo()">GO</button>
        </div>
    </div>

    <!-- 2. Language Selection Gate -->
    <div id="lang-gate" class="gate-overlay hidden">
        <div class="gate-card" style="width: 100%; max-width: 320px;">
            <div class="watermark-title" style="font-size: 22px; margin-bottom: 6px;">Select Language</div>
            <div style="font-size: 13px; color: rgba(0, 255, 102, 0.5); margin-bottom: 20px; font-weight: 600; mix-blend-mode: overlay;">कृपया भाषा चयन गर्नुहोस् / भाषा चुनें</div>
            
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('ne')">नेपाली (Nepali)</button>
            <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी (Hindi)</button>
        </div>
    </div>

    <!-- 3. Floating Watermark Application Interface -->
    <div class="app-container">
        <div class="top-bar">
            <select id="switcher" class="lang-select" onchange="switchAppLanguage(this.value)">
                <option value="en">English</option>
                <option value="ne">नेपाली</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>

        <div id="text-output" class="text-container"></div>
        <button class="btn-action hidden" id="btn-next-step" onclick="alert(translations[currentLang].alertText)">Enter Rai Electronics 🚀</button>
    </div>

<script>
    const translations = {
        en: {
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Step 1 Complete! Ready for Step 2.",
            lines: [
                "Welcome to Rai Electronics",
                "We offer you the most discounted prices",
                "You can buy every electronic item here",
                "Please Enjoy Your Visit",
                "🌹 🙏 Founder : Uttam Rai 🙏 🌹"
            ]
        },
        ne: {
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "चरण १ पूरा भयो! चरण २ का लागि तयार।",
            lines: [
                "राई इलेक्ट्रोनिक्समा स्वागत छ",
                "हामी तपाईंलाई सहुलियत मूल्यमा सामान दिन्छौं",
                "तपाईं यहाँ सबै इलेक्ट्रोनिक सामान किन्न सक्नुहुन्छ",
                "कृपया तपाईंको भ्रमणको आनन्द लिनुहोस्",
                "🌹 🙏 संस्थापक : उत्तम राई 🙏 🌹"
            ]
        },
        hi: {
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "चरण 1 पूर्ण! चरण 2 के लिए तैयार।",
            lines: [
                "राई इलेक्ट्रॉनिक्स में स्वागत है",
                "हम आपको सबसे अच्छी छूट पर सामान देते हैं",
                "आप यहाँ हर इलेक्ट्रॉनिक आइटम खरीद सकते हैं",
                "कृपया अपनी यात्रा का आनंद लें",
                "🌹 🙏 संस्थापक : उत्तम राय 🙏 🌹"
            ]
        }
    };

    let currentLang = 'en';

    function pressGo() {
        let goGate = document.getElementById('go-gate');
        goGate.classList.add('hidden');

        setTimeout(() => {
            let savedLang = localStorage.getItem('rai_preferred_lang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                document.getElementById('switcher').value = currentLang;
                startExperience();
            } else {
                document.getElementById('lang-gate').classList.remove('hidden');
            }
        }, 200);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        let langGate = document.getElementById('lang-gate');
        langGate.classList.add('hidden');

        setTimeout(() => {
            startExperience();
        }, 200);
    }

    function switchAppLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        startExperience();
    }

    function startExperience() {
        let container = document.getElementById('text-output');
        let btn = document.getElementById('btn-next-step');
        
        container.innerHTML = "";
        btn.classList.add('hidden');
        btn.innerText = translations[currentLang].btnText;

        let lines = translations[currentLang].lines;
        let fragment = document.createDocumentFragment();

        lines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = index === lines.length - 1 ? 'intro-line founder-line' : 'intro-line';
            div.innerText = lineText;
            div.style.animationDelay = `${index * 0.2}s`;
            fragment.appendChild(div);
        });

        container.appendChild(fragment);

        let totalTimeMs = (lines.length * 200) + 150;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
