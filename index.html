<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>App Connect</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    padding: 28px 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h2 {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 13px;
    color: #94a3b8;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .phone-container {
    display: flex;
    align-items: center;
    background: #0f172a;
    border: 1.5px solid #334155;
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .phone-container:focus-within {
    border-color: #3b82f6;
  }

  .country-code {
    padding: 12px;
    background: #1e293b;
    color: #94a3b8;
    font-weight: 600;
    font-size: 14px;
    border-right: 1px solid #334155;
  }

  input[type="tel"],
  input[type="text"],
  input[type="email"] {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 15px;
    outline: none;
  }

  .captcha-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .captcha-display {
    flex: 1;
    background: #0f172a;
    border: 1.5px solid #334155;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 8px;
    color: #38bdf8;
  }

  .action-btn {
    background: #334155;
    border: none;
    color: #cbd5e1;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    transition: background 0.2s;
  }

  .action-btn:hover {
    background: #475569;
  }

  .input-standard {
    background: #0f172a;
    border: 1.5px solid #334155;
    border-radius: 10px;
    transition: border-color 0.2s;
  }

  .input-standard:focus-within {
    border-color: #3b82f6;
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }

  .btn-submit:hover {
    background: #1d4ed8;
  }

  .message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    display: none;
    padding: 10px;
    border-radius: 8px;
  }

  .message.error {
    display: block;
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .message.success {
    display: block;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  .notify-options {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .notify-option {
    flex: 1;
    padding: 10px;
    background: #0f172a;
    border: 1.5px solid #334155;
    border-radius: 8px;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.2s;
  }

  .notify-option.active {
    border-color: #3b82f6;
    color: #38bdf8;
    background: rgba(59, 130, 246, 0.1);
  }

  .connected-screen {
    display: none;
    text-align: center;
    padding: 10px 0;
  }

  .success-icon {
    width: 60px;
    height: 60px;
    background: rgba(34, 197, 94, 0.2);
    color: #22c55e;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    margin: 0 auto 16px auto;
    border: 2px solid #22c55e;
  }

  .connected-screen h3 {
    font-size: 20px;
    color: #ffffff;
    margin-bottom: 8px;
  }

  .connected-screen p {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 4px;
  }

  .timer-text {
    font-size: 12px;
    color: #38bdf8;
    margin-top: 10px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Step 1: Phone & CAPTCHA -->
  <div id="auth-form">
    <div class="header">
      <h2>Enter Mobile Number</h2>
      <p>Verify details to connect with the app</p>
    </div>

    <div class="form-group">
      <label class="label">Mobile Number</label>
      <div class="phone-container">
        <span class="country-code">+91</span>
        <input type="tel" id="phone" placeholder="Enter 10-digit number" maxlength="10">
      </div>
    </div>

    <div class="form-group">
      <label class="label">Security Check</label>
      <div class="captcha-box">
        <div class="captcha-display" id="captcha-code">----</div>
        <button class="action-btn" type="button" onclick="speakCaptcha()" title="Listen to CAPTCHA">🔊</button>
        <button class="action-btn" type="button" onclick="generateCaptcha()" title="Refresh CAPTCHA">↻</button>
      </div>
      <div class="input-standard">
        <input type="text" id="captcha-input" placeholder="Enter CAPTCHA shown above" autocomplete="off">
      </div>
    </div>

    <button class="btn-submit" type="button" onclick="validateStep1()">Connect</button>
    <div class="message" id="msg-box"></div>
  </div>

  <!-- Screen 1: Phone Verification Success State -->
  <div class="connected-screen" id="phone-verified-screen">
    <div class="success-icon">✓</div>
    <h3>Successfully Connected</h3>
    <p id="connected-phone-display">+91 ----------</p>
  </div>

  <!-- Step 2: Email & Notification Preference -->
  <div id="email-form" style="display: none;">
    <div class="header">
      <h2>Email Address</h2>
      <p>Where should order updates be sent?</p>
    </div>

    <div class="form-group">
      <label class="label">Email Address</label>
      <div class="input-standard">
        <input type="email" id="email" placeholder="example@domain.com">
      </div>
    </div>

    <div class="form-group">
      <label class="label">Preferred Alert Channel</label>
      <div class="notify-options">
        <div class="notify-option active" id="opt-email" onclick="selectOption('email')">✉ Email</div>
        <div class="notify-option" id="opt-sms" onclick="selectOption('sms')">💬 SMS / Message</div>
      </div>
    </div>

    <button class="btn-submit" type="button" onclick="validateStep2()">Save & Continue</button>
    <div class="message" id="email-msg-box"></div>
  </div>

  <!-- Screen 2: Final Verification Success Screen -->
  <div class="connected-screen" id="final-screen">
    <div class="success-icon">✓</div>
    <h3>Verification Complete</h3>
    <p id="final-phone-display">+91 ----------</p>
    <p id="final-email-display">Email: ----------</p>
    <div class="timer-text" id="redirect-timer">Redirecting in 4 seconds...</div>
  </div>
</div>

<script>
  let currentCaptcha = "";
  let userPhone = "";
  let selectedChannel = "email";

  function generateCaptcha() {
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let code = "";
    for (let i = 0; i < 5; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    currentCaptcha = code;
    document.getElementById("captcha-code").innerText = code;
    document.getElementById("captcha-input").value = "";
  }

  function speakCaptcha() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const spokenText = currentCaptcha.split('').join(', ');
      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.rate = 0.8;
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Audio feature is not supported in your browser.");
    }
  }

  function showMessage(elementId, text, type) {
    const msgBox = document.getElementById(elementId);
    msgBox.innerText = text;
    msgBox.className = "message " + type;
  }

  function selectOption(type) {
    selectedChannel = type;
    document.getElementById("opt-email").classList.toggle("active", type === 'email');
    document.getElementById("opt-sms").classList.toggle("active", type === 'sms');
  }

  function validateStep1() {
    const phoneInput = document.getElementById("phone").value.trim();
    const captchaInput = document.getElementById("captcha-input").value.trim().toUpperCase();

    if (!/^\d{10}$/.test(phoneInput)) {
      showMessage("msg-box", "Please enter a valid 10-digit mobile number.", "error");
      return;
    }

    if (captchaInput !== currentCaptcha) {
      showMessage("msg-box", "Invalid CAPTCHA code. Please try again.", "error");
      generateCaptcha();
      return;
    }

    userPhone = phoneInput;
    
    // Hide phone form & show verified screen (Matches Screenshot 1)
    document.getElementById("auth-form").style.display = "none";
    document.getElementById("connected-phone-display").innerText = "+91 " + userPhone;
    document.getElementById("phone-verified-screen").style.display = "block";

    // Transition to Email input form
    setTimeout(() => {
      document.getElementById("phone-verified-screen").style.display = "none";
      document.getElementById("email-form").style.display = "block";
    }, 1200);
  }

  function validateStep2() {
    const emailInput = document.getElementById("email").value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailRegex.test(emailInput)) {
      showMessage("email-msg-box", "Please enter a valid email address.", "error");
      return;
    }

    // Hide Email Form & Display Final Success Screen
    document.getElementById("email-form").style.display = "none";
    document.getElementById("final-phone-display").innerText = "+91 " + userPhone;
    document.getElementById("final-email-display").innerText = "Email: " + emailInput;
    document.getElementById("final-screen").style.display = "block";

    // 4-Second Countdown Timer then loop/redirect back
    let timeLeft = 4;
    const timerElem = document.getElementById("redirect-timer");

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerElem.innerText = `Redirecting in ${timeLeft} seconds...`;
      } else {
        clearInterval(countdown);
        // Directs back after 4 seconds complete
        document.getElementById("final-screen").style.display = "none";
        document.getElementById("auth-form").style.display = "block";
        document.getElementById("phone").value = "";
        generateCaptcha();
      }
    }, 1000);
  }

  window.onload = generateCaptcha;
</script>

</body>
</html>
