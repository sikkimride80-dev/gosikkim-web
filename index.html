<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Electronics - Step 1: Cinematic Intro</title>
    <style>
        :root {
            --bg-deep: #050110;
            --glass-bg: rgba(15, 8, 35, 0.98);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1042, var(--bg-deep) 75%);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            padding: 35px 24px;
            border-radius: 32px;
            border: 3px solid #ffff00;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
            position: relative;
            text-align: center;
        }

        .intro-text-box {
            position: relative;
            z-index: 2;
            font-size: 19px;
            font-weight: 800;
            line-height: 2.2;
            max-width: 460px;
            margin: 0 auto;
            text-align: center;
            white-space: pre-line;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .intro-text-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes colorFlickerFast {
            0% { color: #ffff00; }   /* Yellow */
            20% { color: #00ff66; }  /* Green */
            40% { color: #00ccff; }  /* Blue */
            60% { color: #ff3333; }  /* Red */
            80% { color: #ff9900; }  /* Orange */
            100% { color: #cc33ff; } /* Purple */
        }

        .flicker-text {
            animation: colorFlickerFast 2s infinite linear;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ffff00, #ff0055);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
            letter-spacing: 0.5px;
        }
        .btn:hover { transform: translateY(-2px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Auto-Trigger Gateway Overlay (Satisfies Mobile Browser Audio Security Policies) -->
    <div id="audio-gate" style="position: absolute; inset: 0; background: rgba(5, 1, 16, 0.95); z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; border-radius: 30px;">
        <div style="font-size: 20px; font-weight: 900; color: #ffff00; margin-bottom: 12px;">🔌 Rai Electronics</div>
        <div style="font-size: 13px; color: #00ff66; margin-bottom: 20px; font-weight: 600;">Tap anywhere to begin audio & visual experience</div>
        <button class="btn" onclick="startExperience()">Start Cinematic Intro 🚀</button>
    </div>

    <!-- Smooth Fade-In & Color Flickering Intro Box -->
    <div id="intro-box" class="intro-text-box flicker-text">
        Welcome to Rai Electronics

        We offer you the most discounted prices

        You can buy every electronic item here

        Please Enjoy Your Visit

        🌹 🙏 Founder : Uttam Rai 🙏 🌹
    </div>

    <!-- Enter Button (Appears after presentation finishes) -->
    <button class="btn hidden" id="btn-next-step" onclick="alert('Step 1 Intro Complete! Ready for Step 2.')">Enter Rai Electronics 🚀</button>
</div>

<script>
    function startExperience() {
        // Remove the audio restriction gate instantly on tap
        let gate = document.getElementById('audio-gate');
        gate.style.opacity = '0';
        setTimeout(() => { gate.style.display = 'none'; }, 300);

        // Trigger visual fade-in animation
        let introBox = document.getElementById('intro-box');
        setTimeout(() => {
            introBox.classList.add('visible');
        }, 100);

        // Trigger guaranteed automated speech synthesis narration
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance("Welcome to Rai Electronics. We offer you the most discounted prices. You can buy every electronic item here. Please enjoy your visit. Founder Uttam Rai.");
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // Reveal the final enter button after the presentation finishes (~4.5 seconds)
        setTimeout(() => {
            document.getElementById('btn-next-step').classList.remove('hidden');
        }, 4500);
    }
</script>

</body>
</html>
