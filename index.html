<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Electronics - Step 1: Cinematic Intro</title>
    <style>
        :root {
            --bg-deep: #050110;
            --glass-bg: rgba(15, 8, 35, 0.98);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1042, var(--bg-deep) 75%);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            padding: 35px 24px;
            border-radius: 32px;
            border: 3px solid #ffff00;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
            position: relative;
            text-align: center;
        }

        .rain-text-container {
            position: relative;
            z-index: 2;
            font-size: 20px;
            font-weight: 800;
            line-height: 2.2;
            max-width: 460px;
            margin: 0 auto;
            text-align: center;
        }

        /* Word wrapper to prevent splitting words across lines */
        .word-wrapper {
            display: inline-block;
            white-space: nowrap;
            margin-right: 6px;
        }

        .line-break {
            display: block;
            height: 10px;
        }

        @keyframes smoothDrop {
            0% { opacity: 0; transform: translateY(-40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes colorFlicker {
            0% { color: #ffff00; }   /* Yellow */
            16% { color: #00ff66; }  /* Green */
            33% { color: #00ccff; }  /* Blue */
            50% { color: #ff3333; }  /* Red */
            66% { color: #ff9900; }  /* Orange */
            83% { color: #cc33ff; }  /* Purple */
            100% { color: #ffff00; } /* Yellow */
        }

        .rain-char {
            display: inline-block;
            opacity: 0;
            animation: smoothDrop 0.25s ease-out forwards, colorFlicker 3.5s infinite linear;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ffff00, #ff0055);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 30px;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
            letter-spacing: 0.5px;
        }
        .btn:hover { transform: translateY(-2px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Rain Text Container -->
    <div id="rain-text-output" class="rain-text-container"></div>

    <!-- Enter Button (Appears strictly after rain finishes) -->
    <button class="btn hidden" id="btn-next-step" onclick="alert('Step 1 Intro Complete! Ready for Step 2.')">Enter Rai Electronics 🚀</button>
</div>

<script>
    // Structured lines with natural words
    const lines = [
        ["Welcome", "to", "Rai", "Electronics"],
        ["We", "offer", "you", "the", "most", "discounted", "prices"],
        ["You", "can", "buy", "every", "electronic", "item", "here"],
        ["Please", "Enjoy", "Your", "Visit"],
        ["Founder", ":", "Uttam", "Rai"]
    ];

    function startRainIntro() {
        let container = document.getElementById('rain-text-output');
        container.innerHTML = "";
        
        let globalCharIndex = 0;

        lines.forEach((wordsInLine, lineIndex) => {
            wordsInLine.forEach((word) => {
                let wordSpan = document.createElement('span');
                wordSpan.className = 'word-wrapper';
                
                for (let i = 0; i < word.length; i++) {
                    let char = word.charAt(i);
                    let charSpan = document.createElement('span');
                    charSpan.className = 'rain-char';
                    charSpan.innerText = char;
                    
                    // Stagger drop delay + slight color animation offset so they flicker organically
                    charSpan.style.animationDelay = `${globalCharIndex * 0.022}s, ${globalCharIndex * 0.1}s`;
                    
                    wordSpan.appendChild(charSpan);
                    globalCharIndex++;
                }
                container.appendChild(wordSpan);
            });

            if (lineIndex < lines.length - 1) {
                let br = document.createElement('div');
                br.className = 'line-break';
                container.appendChild(br);
            }
        });

        // Calculate total animation time and reveal button exactly when done
        let totalCharacters = globalCharIndex;
        let totalAnimationTimeMs = (totalCharacters * 22) + 250;

        setTimeout(() => {
            document.getElementById('btn-next-step').classList.remove('hidden');
        }, totalAnimationTimeMs);
    }

    window.onload = function() {
        startRainIntro();
    };
</script>

</body>
</html>
