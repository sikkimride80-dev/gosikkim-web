<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>App Connect</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    padding: 28px 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h2 {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 13px;
    color: #94a3b8;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .phone-container {
    display: flex;
    align-items: center;
    background: #0f172a;
    border: 1.5px solid #334155;
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .phone-container:focus-within {
    border-color: #3b82f6;
  }

  .country-code {
    padding: 12px;
    background: #1e293b;
    color: #94a3b8;
    font-weight: 600;
    font-size: 14px;
    border-right: 1px solid #334155;
  }

  input[type="tel"],
  input[type="text"] {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 15px;
    outline: none;
  }

  .captcha-box {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .captcha-display {
    flex: 1;
    background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
    border: 1px dashed #64748b;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-family: 'Courier New', Courier, monospace;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 6px;
    color: #38bdf8;
    text-decoration: line-through;
    font-style: italic;
  }

  .refresh-btn {
    background: #334155;
    border: none;
    color: #cbd5e1;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    transition: background 0.2s;
  }

  .refresh-btn:hover {
    background: #475569;
  }

  .input-standard {
    background: #0f172a;
    border: 1.5px solid #334155;
    border-radius: 10px;
    transition: border-color 0.2s;
  }

  .input-standard:focus-within {
    border-color: #3b82f6;
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }

  .btn-submit:hover {
    background: #1d4ed8;
  }

  .message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    display: none;
    padding: 10px;
    border-radius: 8px;
  }

  .message.error {
    display: block;
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .message.success {
    display: block;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  .connected-screen {
    display: none;
    text-align: center;
    padding: 20px 0;
  }

  .success-icon {
    width: 60px;
    height: 60px;
    background: rgba(34, 197, 94, 0.2);
    color: #22c55e;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    margin: 0 auto 16px auto;
    border: 2px solid #22c55e;
  }

  .connected-screen h3 {
    font-size: 20px;
    color: #ffffff;
    margin-bottom: 8px;
  }

  .connected-screen p {
    font-size: 14px;
    color: #94a3b8;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Authentication Form -->
  <div id="auth-form">
    <div class="header">
      <h2>Enter Mobile Number</h2>
      <p>Verify details to connect with the app</p>
    </div>

    <div class="form-group">
      <label class="label">Mobile Number</label>
      <div class="phone-container">
        <span class="country-code">+91</span>
        <input type="tel" id="phone" placeholder="Enter 10-digit number" maxlength="10">
      </div>
    </div>

    <div class="form-group">
      <label class="label">Security Check</label>
      <div class="captcha-box">
        <div class="captcha-display" id="captcha-code">----</div>
        <button class="refresh-btn" type="button" onclick="generateCaptcha()" title="Refresh CAPTCHA">↻</button>
      </div>
      <div class="input-standard">
        <input type="text" id="captcha-input" placeholder="Enter CAPTCHA shown above" autocomplete="off">
      </div>
    </div>

    <button class="btn-submit" type="button" onclick="validateForm()">Connect</button>
    <div class="message" id="msg-box"></div>
  </div>

  <!-- Connected Success State -->
  <div class="connected-screen" id="connected-screen">
    <div class="success-icon">✓</div>
    <h3>Successfully Connected</h3>
    <p id="connected-phone">+91 ----------</p>
  </div>
</div>

<script>
  let currentCaptcha = "";

  function generateCaptcha() {
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let code = "";
    for (let i = 0; i < 5; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    currentCaptcha = code;
    document.getElementById("captcha-code").innerText = code;
    document.getElementById("captcha-input").value = "";
  }

  function showMessage(text, type) {
    const msgBox = document.getElementById("msg-box");
    msgBox.innerText = text;
    msgBox.className = "message " + type;
  }

  function validateForm() {
    const phoneInput = document.getElementById("phone").value.trim();
    const captchaInput = document.getElementById("captcha-input").value.trim().toUpperCase();

    // Validate phone number (10 digits)
    if (!/^\d{10}$/.test(phoneInput)) {
      showMessage("Please enter a valid 10-digit mobile number.", "error");
      return;
    }

    // Validate CAPTCHA
    if (captchaInput !== currentCaptcha) {
      showMessage("Invalid CAPTCHA code. Please try again.", "error");
      generateCaptcha();
      return;
    }

    // Success - Connect with app
    showMessage("Verified! Connecting...", "success");

    setTimeout(() => {
      document.getElementById("auth-form").style.display = "none";
      document.getElementById("connected-phone").innerText = "+91 " + phoneInput;
      document.getElementById("connected-screen").style.display = "block";
    }, 1000);
  }

  // Generate initial CAPTCHA on page load
  window.onload = generateCaptcha;
</script>

</body>
</html>
