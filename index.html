<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Business OS - Step 1: Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen p-4">

    <div class="max-w-md mx-auto bg-slate-900 rounded-2xl shadow-2xl p-6 border border-slate-800">
        <!-- App Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-emerald-400 tracking-wider">UNIVERSAL OS</h1>
            <p class="text-xs text-slate-400 mt-1">Step 1: Universal Bill & Cash Counter</p>
        </div>

        <!-- Add Item / Service Form -->
        <div class="space-y-4 mb-6 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Item / Service Name</label>
                <input type="text" id="itemName" placeholder="e.g., Shoes, Haircut, Room Booking" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Price (₹)</label>
                    <input type="number" id="itemPrice" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Quantity</label>
                    <input type="number" id="itemQty" value="1" min="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <button onclick="addItem()" class="w-full bg-emerald-500 hover:bg-emerald-400 font-bold text-slate-950 p-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-emerald-500/20">
                + Add to Bill
            </button>
        </div>

        <!-- Active Bill Cart -->
        <div class="mb-6">
            <h2 class="text-sm font-bold uppercase text-slate-400 mb-3 tracking-wider">Current Bill Summary</h2>
            <div id="cartList" class="space-y-2 max-h-40 overflow-y-auto mb-4 text-sm pr-1">
                <p class="text-slate-600 italic text-center py-4 bg-slate-950/30 rounded-xl border border-dashed border-slate-800">No items added yet.</p>
            </div>
            
            <div class="flex justify-between items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
                <span class="text-slate-400 font-semibold">Grand Total:</span>
                <span id="grandTotal" class="text-2xl font-black text-emerald-400">₹0.00</span>
            </div>
        </div>

        <!-- Cash & Change Calculator -->
        <div class="space-y-3 pt-4 border-t border-slate-800">
            <h2 class="text-sm font-bold uppercase text-slate-400 tracking-wider">Cash Register</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Cash Received from Customer</label>
                <input type="number" id="cashReceived" placeholder="Enter amount given" oninput="calculateChange()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm">
                <span class="text-slate-400">Change to Return:</span>
                <span id="changeDue" class="font-black text-yellow-400 text-lg">₹0.00</span>
            </div>
            <button onclick="clearBill()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-semibold p-3 rounded-xl border border-rose-900/50 transition duration-200 text-sm">
                Clear Bill / Complete Transaction
            </button>
        </div>
    </div>

    <script>
        let cart = [];

        function addItem() {
            const nameInput = document.getElementById('itemName');
            const priceInput = document.getElementById('itemPrice');
            const qtyInput = document.getElementById('itemQty');
            
            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value) || 1;

            if (!name || isNaN(price) || price < 0) {
                alert('Please enter a valid name and price.');
                return;
            }

            cart.push({ name, price, qty });
            
            // Reset inputs
            nameInput.value = '';
            priceInput.value = '';
            qtyInput.value = '1';
            nameInput.focus();

            updateCartDisplay();
        }

        function updateCartDisplay() {
            const cartList = document.getElementById('cartList');
            const grandTotalEl = document.getElementById('grandTotal');

            if (cart.length === 0) {
                cartList.innerHTML = '<p class="text-slate-600 italic text-center py-4 bg-slate-950/30 rounded-xl border border-dashed border-slate-800">No items added yet.</p>';
                grandTotalEl.innerText = '₹0.00';
                calculateChange();
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                html += `
                    <div class="flex justify-between items-center bg-slate-950/60 p-3 rounded-xl border border-slate-800/60">
                        <div>
                            <p class="font-semibold text-slate-200">${item.name}</p>
                            <p class="text-xs text-slate-500">₹${item.price} × ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-emerald-400">₹${itemTotal.toFixed(2)}</span>
                            <button onclick="removeItem(${index})" class="text-rose-400 hover:text-rose-300 text-xs bg-rose-500/10 px-2 py-1 rounded-lg">✕</button>
                        </div>
                    </div>
                `;
            });

            cartList.innerHTML = html;
            grandTotalEl.innerText = `₹${total.toFixed(2)}`;
            calculateChange();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function calculateChange() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const cashReceived = parseFloat(document.getElementById('cashReceived').value) || 0;
            const changeDueEl = document.getElementById('changeDue');

            if (cashReceived >= total && total > 0) {
                const change = cashReceived - total;
                changeDueEl.innerText = `₹${change.toFixed(2)}`;
                changeDueEl.className = "font-black text-emerald-400 text-lg";
            } else {
                changeDueEl.innerText = "₹0.00";
                changeDueEl.className = "font-black text-yellow-400 text-lg";
            }
        }

        function clearBill() {
            if (cart.length > 0 && !confirm('Clear current transaction?')) return;
            cart = [];
            document.getElementById('cashReceived').value = '';
            updateCartDisplay();
        }
    </script>
</body>
</html>
