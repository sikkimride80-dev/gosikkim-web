<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rai Electronics - Flagship Experience</title>
    <style>
        :root {
            --bg-void: #020008;
            --accent-gold: #ffd700;
            --accent-cyan: #00f3ff;
            --glass-bg: rgba(12, 6, 28, 0.88);
            --border-glow: linear-gradient(135deg, #ffd700, #ff0055, #00f3ff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-void);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Mesh */
        .ambient-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, #1a0b36 0%, #05010d 60%, var(--bg-void) 100%);
            z-index: 0;
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 0, 85, 0.15) 0%, rgba(0, 243, 255, 0.1) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }

        /* Overlay Gate Layer */
        .gate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 0, 8, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* GO Button Ring */
        .go-btn-wrapper {
            position: relative;
            margin-top: 30px;
        }

        .go-btn-glow {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffd700, #ff0055, #00f3ff, #00ff66);
            filter: blur(12px);
            opacity: 0.8;
            animation: pulseGlow 2s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .go-btn {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #090317;
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            border: 2px solid rgba(255, 215, 0, 0.6);
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 2px;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .go-btn:active {
            transform: scale(0.92);
        }

        /* Main Container Card */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 32px 20px;
            border-radius: 28px;
            border: 2px solid rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15), 0 20px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
            margin: 16px;
        }

        /* Top Language Bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.06);
            color: var(--accent-gold);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .lang-select option {
            background: #090317;
            color: #ffffff;
        }

        /* Letter Rain Container */
        .rain-text-container {
            font-size: 18px;
            font-weight: 800;
            line-height: 2.1;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .word-wrapper {
            display: inline-block;
            white-space: nowrap;
            margin-right: 5px;
        }

        .line-break {
            display: block;
            height: 12px;
            width: 100%;
        }

        /* GPU-Accelerated Letter Drop Animation */
        @keyframes fastDropHardware {
            0% {
                opacity: 0;
                transform: translate3d(0, -25px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        @keyframes colorFlickerFast {
            0% { color: #ffff00; }   /* Yellow */
            16% { color: #00ff66; }  /* Green */
            33% { color: #00f3ff; }  /* Blue */
            50% { color: #ff3333; }  /* Red */
            66% { color: #ff9900; }  /* Orange */
            83% { color: #cc33ff; }  /* Purple */
            100% { color: #ffff00; } /* Yellow */
        }

        .rain-char {
            display: inline-block;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDropHardware 0.12s cubic-bezier(0, 0, 0.2, 1) forwards, colorFlickerFast 0.9s infinite linear;
        }

        .icon-item {
            display: inline-flex;
            align-items: center;
            margin: 0 3px;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDropHardware 0.12s cubic-bezier(0, 0, 0.2, 1) forwards;
            font-size: 20px;
            vertical-align: middle;
        }

        /* Action Buttons */
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ff0055 50%, #00f3ff 100%);
            background-size: 200% 200%;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.2s ease, opacity 0.3s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #ffffff;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .lang-btn:active {
            background: var(--accent-gold);
            color: #000000;
            transform: scale(0.98);
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="ambient-glow"></div>

    <!-- 1. Mandatory GO Entry Gate -->
    <div id="go-gate" class="gate-overlay">
        <div style="font-size: 26px; font-weight: 900; color: var(--accent-gold); letter-spacing: 1px;">🔌 RAI ELECTRONICS</div>
        <div style="font-size: 13px; color: var(--accent-cyan); margin-top: 6px; font-weight: 600; letter-spacing: 0.5px;">Flagship Digital Experience</div>
        
        <div class="go-btn-wrapper" onclick="pressGo()">
            <div class="go-btn-glow"></div>
            <button class="go-btn">GO</button>
        </div>
    </div>

    <!-- 2. Language Selection Gate -->
    <div id="lang-gate" class="gate-overlay hidden">
        <div style="font-size: 22px; font-weight: 900; color: var(--accent-gold); margin-bottom: 6px;">Select Language</div>
        <div style="font-size: 13px; color: #00ff66; margin-bottom: 24px; font-weight: 600;">कृपया भाषा चयन गर्नुहोस् / भाषा चुनें</div>
        
        <div style="width: 100%; max-width: 280px;">
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('ne')">नेपाली (Nepali)</button>
            <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी (Hindi)</button>
        </div>
    </div>

    <!-- 3. Main Dashboard Card -->
    <div class="app-container">
        <div class="top-bar">
            <select id="switcher" class="lang-select" onchange="switchAppLanguage(this.value)">
                <option value="en">English</option>
                <option value="ne">नेपाली</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>

        <div id="rain-text-output" class="rain-text-container"></div>
        <button class="btn-action hidden" id="btn-next-step" onclick="alert(translations[currentLang].alertText)">Enter Rai Electronics 🚀</button>
    </div>

<script>
    const translations = {
        en: {
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Step 1 Complete! Ready for Step 2.",
            lines: [
                ["Welcome", "to", "Rai", "Electronics"],
                ["We", "offer", "you", "the", "most", "discounted", "prices"],
                ["You", "can", "buy", "every", "electronic", "item", "here"],
                ["Please", "Enjoy", "Your", "Visit"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "Founder" }, { type: "word", text: ":" },
                    { type: "word", text: "Uttam" }, { type: "word", text: "Rai" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        },
        ne: {
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "चरण १ पूरा भयो! चरण २ का लागि तयार।",
            lines: [
                ["राई", "इलेक्ट्रोनिक्समा", "स्वागत", "छ"],
                ["हामी", "तपाईंलाई", "सहुलियत", "मूल्यमा", "सामान", "दिन्छौं"],
                ["तपाईं", "यहाँ", "सबै", "इलेक्ट्रोनिक", "सामान", "किन्न", "सक्नुहुन्छ"],
                ["कृपया", "तपाईंको", "भ्रमणको", "आनन्द", "लिनुहोस्"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "संस्थापक" }, { type: "word", text: ":" },
                    { type: "word", text: "उत्तम" }, { type: "word", text: "राई" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        },
        hi: {
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "चरण 1 पूर्ण! चरण 2 के लिए तैयार।",
            lines: [
                ["राई", "इलेक्ट्रॉनिक्स", "में", "स्वागत", "है"],
                ["हम", "आपको", "सबसे", "अच्छी", "छूट", "पर", "सामान", "देते", "हैं"],
                ["आप", "यहाँ", "हर", "इलेक्ट्रॉनिक", "आइटम", "खरीद", "सकते", "हैं"],
                ["कृपया", "अपनी", "यात्रा", "का", "आनंद", "लें"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "संस्थापक" }, { type: "word", text: ":" },
                    { type: "word", text: "उत्तम" }, { type: "word", text: "राय" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        }
    };

    let currentLang = 'en';

    function pressGo() {
        let goGate = document.getElementById('go-gate');
        goGate.classList.add('hidden');

        setTimeout(() => {
            let savedLang = localStorage.getItem('rai_preferred_lang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                document.getElementById('switcher').value = currentLang;
                startExperience();
            } else {
                document.getElementById('lang-gate').classList.remove('hidden');
            }
        }, 200);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        let langGate = document.getElementById('lang-gate');
        langGate.classList.add('hidden');

        setTimeout(() => {
            startExperience();
        }, 200);
    }

    function switchAppLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        startExperience();
    }

    function startExperience() {
        let container = document.getElementById('rain-text-output');
        let btn = document.getElementById('btn-next-step');
        
        container.innerHTML = "";
        btn.classList.add('hidden');
        btn.innerText = translations[currentLang].btnText;

        let globalIndex = 0;
        let dataLines = translations[currentLang].lines;
        let fragment = document.createDocumentFragment();

        dataLines.forEach((lineData, lineIndex) => {
            let wordsInLine = Array.isArray(lineData) 
                ? lineData.map(w => ({ type: "word", text: w }))
                : lineData.items;

            wordsInLine.forEach((item) => {
                let wordSpan = document.createElement('span');
                wordSpan.className = 'word-wrapper';

                if (item.type === "icon") {
                    let iconSpan = document.createElement('span');
                    iconSpan.className = 'icon-item';
                    iconSpan.innerText = item.text;
                    iconSpan.style.animationDelay = `${globalIndex * 0.02}s`;
                    wordSpan.appendChild(iconSpan);
                    globalIndex++;
                } else {
                    let word = item.text;
                    for (let i = 0; i < word.length; i++) {
                        let charSpan = document.createElement('span');
                        charSpan.className = 'rain-char';
                        charSpan.innerText = word.charAt(i);
                        // Stagger delay optimized to 0.02s per character for buttery 60fps drops
                        charSpan.style.animationDelay = `${globalIndex * 0.02}s, ${globalIndex * 0.03}s`;
                        wordSpan.appendChild(charSpan);
                        globalIndex++;
                    }
                }
                fragment.appendChild(wordSpan);
            });

            if (lineIndex < dataLines.length - 1) {
                let br = document.createElement('div');
                br.className = 'line-break';
                fragment.appendChild(br);
            }
        });

        container.appendChild(fragment);

        // Reveal enter button right as letter animation completes
        let totalTimeMs = (globalIndex * 20) + 200;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
