<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Text - Number Pins on Photo</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0e0e0e;color:#fff}
header{padding:10px;display:flex;gap:6px;justify-content:space-between;background:#111;position:sticky;top:0;z-index:99}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700}
.white{background:#fff;color:#000}
.dark{background:#2a2a2a;color:#fff}
#uploadBox{border:2px dashed #444;padding:25px;text-align:center;border-radius:14px;margin:10px}
#wrap{position:relative;margin:10px;background:#000;border-radius:12px;overflow:hidden}
#canvas{display:block;width:100%}
.pin{position:absolute;width:26px;height:26px;background:#ff2a2a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid #fff;cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pin.active{background:#fff;color:#ff2a2a;scale:1.2}
.text-line{background:#1e1e1e;border:1px solid #333;padding:8px 10px;border-radius:12px;display:flex;gap:8px;margin:6px 10px;align-items:center}
.text-line input{flex:1;background:#000;color:#fff;border:1px solid #444;padding:8px;border-radius:8px}
.small{padding:7px 10px;border-radius:8px;border:none;font-weight:700;font-size:11px}
.edit{background:#fff;color:#000}
.del{background:#ff3b3b;color:#fff}
.save{margin:10px;width:calc(100% - 20px);padding:14px;background:#fff;color:#000;border-radius:12px;font-weight:800;border:none}
#status{text-align:center;font-size:12px;opacity:.7;margin:6px}
</style>
</head>
<body>
<header>
<div style="font-size:13px">✏️ Edit Text • Pins on Photo</div>
<button class="btn dark" onclick="file.click()">Upload</button>
<button class="btn white" onclick="saveImg()">Save to Gallery</button>
</header>

<div id="uploadBox" onclick="file.click()">
<input type="file" id="file" accept="image/*" hidden>
<b>+ Upload Photo Max 19MB</b><br><small>JPG PNG WEBP</small>
<div id="status">Tap Detect to auto-scan pins 1,2,3... on photo</div>
</div>

<div id="wrap" style="display:none">
<canvas id="canvas"></canvas>
</div>

<button id="detectBtn" class="btn dark" style="margin:10px;width:calc(100% - 20px);display:none" onclick="detectText()">🔍 Auto Detect & Pin Numbers 1,2,3... on Photo</button>

<div id="list"></div>
<button class="save" id="saveBtn" style="display:none" onclick="saveImg()">💾 Save Edited Photo to Phone</button>

<script>
const file=document.getElementById('file'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), wrap=document.getElementById('wrap'), listEl=document.getElementById('list'), statusEl=document.getElementById('status');
let img=null, texts=[];

file.addEventListener('change',e=>{
 const f=e.target.files[0];
 if(f.size>19*1024*1024){alert('Max 19MB');return;}
 const r=new FileReader();
 r.onload=ev=>{
  const im=new Image();
  im.onload=()=>{
   img=im; canvas.width=im.width; canvas.height=im.height;
   wrap.style.display='block'; detectBtn.style.display='block'; saveBtn.style.display='block';
   ctx.drawImage(im,0,0); texts=[]; drawPins(); renderList();
   statusEl.innerText='Photo loaded. Click Detect to pin numbers.';
  };
  im.src=ev.target.result;
 };
 r.readAsDataURL(f);
});

async function detectText(){
 if(!img) return;
 statusEl.innerText='Scanning text... 10 sec please wait';
 // clear old pins
 document.querySelectorAll('.pin').forEach(p=>p.remove());
 try{
  const {data}=await Tesseract.recognize(canvas.toDataURL(),'eng');
  texts = data.lines.filter(l=>l.text.trim().length>1).map(l=>({
   x:l.bbox.x0, y:l.bbox.y0, w:l.bbox.x1-l.bbox.x0, h:l.bbox.y1-l.bbox.y0,
   newText:l.text.trim(), oldText:l.text.trim()
  }));
  if(texts.length==0) texts = data.words.filter(w=>w.text.trim().length>2).map(w=>({
   x:w.bbox.x0, y:w.bbox.y0, w:w.bbox.x1-w.bbox.x0, h:w.bbox.y1-w.bbox.y0,
   newText:w.text.trim(), oldText:w.text.trim()
  }));
  statusEl.innerText=`Found ${texts.length} texts → Pinned as 1,2,3... on photo`;
  redraw(); drawPins(); renderList();
 }catch(err){
  statusEl.innerText='Auto failed, tap on photo to manually pin numbers';
 }
}

function drawPins(){
 document.querySelectorAll('.pin').forEach(p=>p.remove());
 const rect=canvas.getBoundingClientRect();
 texts.forEach((t,i)=>{
   const pin=document.createElement('div');
   pin.className='pin';
   pin.innerText=i+1;
   // position based on canvas scale
   const scaleX=rect.width/canvas.width;
   const scaleY=rect.height/canvas.height;
   pin.style.left=(t.x*scaleX)+'px';
   pin.style.top=(t.y*scaleY)+'px';
   pin.onclick=()=>editIdx(i);
   wrap.appendChild(pin);
 });
}

function renderList(){
 listEl.innerHTML=texts.map((t,i)=>`
  <div class="text-line" id="line${i}">
   <div style="min-width:20px;font-weight:800;color:#ff2a2a">${i+1}.</div>
   <input value="${t.newText.replace(/"/g,'&quot;')}" oninput="texts[${i}].newText=this.value; redraw()">
   <button class="small edit" onclick="editIdx(${i})">Edit</button>
   <button class="small del" onclick="delIdx(${i})">Delete</button>
  </div>
 `).join('');
}

function editIdx(i){
 const v=prompt(`Edit Text #${i+1}:`,texts[i].newText);
 if(v!==null){texts[i].newText=v; renderList(); redraw();}
 document.querySelectorAll('.pin').forEach((p,idx)=>p.classList.toggle('active',idx==i));
 setTimeout(()=>document.querySelectorAll('.pin').forEach(p=>p.classList.remove('active')),800);
}
function delIdx(i){texts.splice(i,1); redraw(); drawPins(); renderList();}

function redraw(){
 if(!img) return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,0,0);
 texts.forEach(t=>{
   // erase
   try{
    const data=ctx.getImageData(t.x,t.y,1,1).data;
    ctx.fillStyle=`rgb(${data[0]},${data[1]},${data[2]})`;
   }catch(e){ctx.fillStyle='#000'}
   ctx.fillRect(t.x-2,t.y-2,t.w+6,t.h+6);
   // new text
   ctx.fillStyle='#fff';
   // if chat text was small, keep small
   let fs=Math.max(12,t.h*0.85);
   ctx.font=`bold ${fs}px Arial`;
   while(ctx.measureText(t.newText).width>t.w+30 && fs>8){fs--;ctx.font=`bold ${fs}px Arial`;}
   ctx.fillText(t.newText,t.x,t.y+t.h*0.8);
 });
 // re-position pins after redraw
 setTimeout(drawPins,50);
}

// manual tap to add pin number
canvas.addEventListener('click',e=>{
 if(!img) return;
 const rect=canvas.getBoundingClientRect();
 const x=(e.clientX-rect.left)*(canvas.width/rect.width);
 const y=(e.clientY-rect.top)*(canvas.height/rect.height);
 // if near existing pin, edit it
 const hit=texts.findIndex(t=>Math.abs(t.x-x)<30 && Math.abs(t.y-y)<30);
 if(hit>=0){editIdx(hit); return;}
 const txt=prompt(`Add Text #${texts.length+1} at this spot:`,'');
 if(!txt) return;
 texts.push({x,y,w:150,h:20,newText:txt,oldText:''});
 redraw(); drawPins(); renderList();
});

window.addEventListener('resize',()=>{if(texts.length) drawPins();});

function saveImg(){
 if(!img){alert('Upload first');return;}
 // hide pins for save
 document.querySelectorAll('.pin').forEach(p=>p.style.display='none');
 redraw();
 setTimeout(()=>{
  const a=document.createElement('a');
  a.download=`edited_${Date.now()}.jpg`;
  a.href=canvas.toDataURL('image/jpeg',0.92);
  a.click();
  document.querySelectorAll('.pin').forEach(p=>p.style.display='flex');
  statusEl.innerText='Saved to Gallery / Downloads';
 },200);
}
</script>
</body>
</html>
