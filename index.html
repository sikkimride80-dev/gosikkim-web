<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smilings - Step 1: Select Language</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #5b4bc4;
            --accent-glow: rgba(108, 92, 231, 0.35);
            --bg-dark: #090a0f;
            --card-bg: rgba(20, 22, 32, 0.9);
            --text-light: #ffffff;
            --text-dim: #9aa0b4;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(108, 92, 231, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 243, 255, 0.12) 0%, transparent 45%);
            color: var(--text-light);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        /* Fixed Top Edit Language Corner Button */
        .top-lang-edit-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            color: var(--text-light);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .top-lang-edit-btn:hover {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.2);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 30px 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
        }

        .app-brand {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7, #00f3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .step-badge {
            display: inline-block;
            background: rgba(108, 92, 231, 0.2);
            color: #a29bfe;
            border: 1px solid rgba(108, 92, 231, 0.4);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Question Title & Subtitle */
        .instruction-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .instruction-sub {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .language-box-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .language-select-trigger {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            color: var(--text-light);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .language-select-trigger:hover, .language-select-trigger:focus {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.12);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .selected-lang-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-arrow {
            font-size: 12px;
            color: var(--text-dim);
            transition: transform 0.3s ease;
        }

        .dropdown-arrow.open {
            transform: rotate(180deg);
        }

        /* Modal Overlay & Bottom Sheet */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .language-modal {
            width: 100%;
            max-width: 480px;
            background: #121420;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .modal-overlay.active .language-modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-light);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-light);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        .language-list {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .language-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .language-item:hover, .language-item.selected {
            background: rgba(108, 92, 231, 0.18);
            border-color: var(--primary);
        }

        .lang-names {
            text-align: left;
        }

        .lang-native {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-light);
        }

        .lang-english {
            font-size: 12px;
            color: var(--text-dim);
        }

        .state-tag {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            padding: 3px 8px;
            border-radius: 6px;
            max-width: 140px;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .btn-continue {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: var(--text-light);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--accent-glow);
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .btn-continue:active {
            transform: scale(0.98);
        }

        @media (min-width: 600px) {
            .modal-overlay {
                align-items: center;
            }
            .language-modal {
                border-radius: 28px;
                border-bottom: 1px solid var(--border-color);
                max-height: 72vh;
                transform: scale(0.9);
            }
            .modal-overlay.active .language-modal {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- Persistent Edit Language Button at Top Right -->
    <button class="top-lang-edit-btn" onclick="openLanguageModal()">
        <span>🌐</span>
        <span id="topLangBadge">English</span>
        <span>✏️</span>
    </button>

    <div class="container">
        <div class="app-brand">Smilings</div>
        <div class="step-badge" id="stepBadgeText">Step 1 of Unlimited</div>

        <!-- Language Question Title & Description -->
        <div class="instruction-title" id="titleText">Select your preferred language for the app</div>
        <div class="instruction-sub" id="subText">Every text and feature in the app will adapt to your chosen language</div>

        <div class="language-box-wrapper">
            <button type="button" class="language-select-trigger" onclick="openLanguageModal()">
                <div class="selected-lang-display">
                    <span style="font-size: 18px;">🌐</span>
                    <span id="currentLangLabel">English (Auto)</span>
                </div>
                <span class="dropdown-arrow" id="dropdownArrow">▼</span>
            </button>
        </div>

        <button type="button" class="btn-continue" id="continueBtnText" onclick="proceedToNextStep()">
            CONTINUE
        </button>
    </div>

    <!-- Language Selection Bottom Sheet Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutsideClick(event)">
        <div class="language-modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitleText">Choose Your State / Preferred Language</span>
                <button class="close-btn" onclick="closeLanguageModal()">✕</button>
            </div>

            <input type="text" id="searchInput" class="search-box" placeholder="Search language or state..." oninput="filterLanguages()">

            <div class="language-list" id="languageList">
                <!-- Comprehensive Indian Languages Generated Here -->
            </div>
        </div>
    </div>

        { native: "मारवाड़ी", english: "Marwari", state: "Rajasthan", code: "mwr" },
        { native: "छत्तीसगढ़ी", english: "Chhattisgarhi", state: "Chhattisgarh", code: "ctg" },
        { native: "हरियाणवी", english: "Haryanvi", state: "Haryana", code: "bgc" },
        { native: "तुळु", english: "Tulu", state: "Karnataka, Kerala", code: "tcy" },
        { native: "खसी", english: "Khasi", state: "Meghalaya", code: "kha" },
        { native: "गारो", english: "Garo", state: "Meghalaya", code: "grt" },
        { native: "मिज़ो", english: "Mizo", state: "Mizoram", code: "lus" },
        { native: "नागामीस", english: "Nagamese", state: "Nagaland", code: "nag" },
        { native: "कोकबोरोक", english: "Kokborok", state: "Tripura", code: "trv" },
        { native: "लद्दाखी", english: "Ladakhi", state: "Ladakh", code: "lbj" }
    ];

    let selectedLang = indianLanguages[0];

    function renderLanguages(list) {
        const container = document.getElementById('languageList');
        container.innerHTML = '';

        list.forEach(item => {
            const isSelected = item.code === selectedLang.code;
            const div = document.createElement('div');
            div.className = `language-item ${isSelected ? 'selected' : ''}`;
            div.onclick = () => selectLanguage(item);

            div.innerHTML = `
                <div class="lang-names">
                    <div class="lang-native">${item.native}</div>
                    <div class="lang-english">${item.english}</div>
                </div>
                <div class="state-tag" title="${item.state}">${item.state}</div>
            `;
            container.appendChild(div);
        });
    }

    function openLanguageModal() {
        document.getElementById('modalOverlay').classList.add('active');
        document.getElementById('dropdownArrow').classList.add('open');
        renderLanguages(indianLanguages);
    }

    function closeLanguageModal() {
        document.getElementById('modalOverlay').classList.remove('active');
        document.getElementById('dropdownArrow').classList.remove('open');
        document.getElementById('searchInput').value = '';
    }

    function closeModalOnOutsideClick(event) {
        if (event.target.id === 'modalOverlay') {
            closeLanguageModal();
        }
    }

    function selectLanguage(item) {
        selectedLang = item;
        document.getElementById('currentLangLabel').innerText = `${item.english} (${item.native})`;
        document.getElementById('topLangBadge').innerText = item.english;
        
        // Translate app UI dynamically
        applyTranslations(item);
        
        closeLanguageModal();
    }

    function applyTranslations(item) {
        const t = item.translations || {
            title: `App Preferred Language: ${item.english}`,
            sub: "Every text and feature in the app will adapt to your chosen language",
            continue: "CONTINUE",
            step: "Step 1 of Unlimited",
            modalTitle: "Choose Your State / Preferred Language"
        };

        document.getElementById('titleText').innerText = t.title;
        document.getElementById('subText').innerText = t.sub;
        document.getElementById('continueBtnText').innerText = t.continue;
        document.getElementById('stepBadgeText').innerText = t.step;
        document.getElementById('modalTitleText').innerText = t.modalTitle;
    }

    function filterLanguages() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = indianLanguages.filter(item => 
            item.english.toLowerCase().includes(query) ||
            item.native.toLowerCase().includes(query) ||
            item.state.toLowerCase().includes(query)
        );
        renderLanguages(filtered);
    }

    function proceedToNextStep() {
        alert(`Step 1 Completed!\nSelected Language: ${selectedLang.english} (${selectedLang.native}).\n\nReady to build Step 2 when you give the word!`);
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderLanguages(indianLanguages);
    });
</script>

</body>
</html>
