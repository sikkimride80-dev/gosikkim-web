<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Electronics - Step 1: Cinematic Intro</title>
    <style>
        :root {
            --bg-deep: #050110;
            --glass-bg: rgba(15, 8, 35, 0.98);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1042, var(--bg-deep) 75%);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            padding: 35px 24px;
            border-radius: 32px;
            border: 3px solid #ffff00;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
            position: relative;
            text-align: center;
        }

        .rain-text-container {
            position: relative;
            z-index: 2;
            font-size: 20px;
            font-weight: 800;
            line-height: 2.2;
            max-width: 460px;
            margin: 0 auto;
            text-align: center;
        }

        .word-wrapper {
            display: inline-block;
            white-space: nowrap;
            margin-right: 6px;
        }

        .line-break {
            display: block;
            height: 10px;
        }

        @keyframes fastDrop {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes colorFlickerFast {
            0% { color: #ffff00; }   /* Yellow */
            20% { color: #00ff66; }  /* Green */
            40% { color: #00ccff; }  /* Blue */
            60% { color: #ff3333; }  /* Red */
            80% { color: #ff9900; }  /* Orange */
            100% { color: #cc33ff; } /* Purple */
        }

        .rain-char {
            display: inline-block;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDrop 0.15s ease-out forwards, colorFlickerFast 0.8s infinite linear;
        }

        .icon-item {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDrop 0.15s ease-out forwards;
            font-size: 22px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ffff00, #ff0055);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 30px;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
            letter-spacing: 0.5px;
        }
        .btn:hover { transform: translateY(-2px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Audio Gate to bypass mobile browser speech/audio restrictions -->
<div id="audio-gate" style="position: fixed; inset: 0; background: rgba(5,1,16,0.96); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center;">
    <div style="font-size: 22px; font-weight: 900; color: #ffff00; margin-bottom: 10px;">🔌 Rai Electronics</div>
    <div style="font-size: 13px; color: #00ff66; margin-bottom: 25px; font-weight: 600;">Tap anywhere to launch fast cinematic experience with voice</div>
    <button class="btn" style="max-width: 280px;" onclick="startExperience()">Launch Experience 🚀</button>
</div>

<div class="app-container">
    <div id="rain-text-output" class="rain-text-container"></div>
    <button class="btn hidden" id="btn-next-step" onclick="alert('Step 1 Intro Complete! Ready for Step 2.')">Enter Rai Electronics 🚀</button>
</div>

<script>
    const lines = [
        ["Welcome", "to", "Rai", "Electronics"],
        ["We", "offer", "you", "the", "most", "discounted", "prices"],
        ["You", "can", "buy", "every", "electronic", "item", "here"],
        ["Please", "Enjoy", "Your", "Visit"],
        { type: "founder", items: [
            { type: "icon", text: "🌹" },
            { type: "icon", text: "🙏" },
            { type: "word", text: "Founder" },
            { type: "word", text: ":" },
            { type: "word", text: "Uttam" },
            { type: "word", text: "Rai" },
            { type: "icon", text: "🙏" },
            { type: "icon", text: "🌹" }
        ]}
    ];

    function startExperience() {
        // Remove audio gate overlay
        let gate = document.getElementById('audio-gate');
        gate.style.opacity = '0';
        setTimeout(() => { gate.style.display = 'none'; }, 300);

        // Trigger voice narration
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance("Welcome to Rai Electronics. We offer you the most discounted prices. You can buy every electronic item here. Please enjoy your visit. Founder Uttam Rai.");
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // Start fast letter rain drop animation
        let container = document.getElementById('rain-text-output');
        container.innerHTML = "";
        let globalIndex = 0;

        lines.forEach((lineData, lineIndex) => {
            let wordsInLine = [];
            if (Array.isArray(lineData)) {
                wordsInLine = lineData.map(w => ({ type: "word", text: w }));
            } else if (lineData.type === "founder") {
                wordsInLine = lineData.items;
            }

            let wordSpan = document.createElement('span');
            wordSpan.className = 'word-wrapper';

            wordsInLine.forEach((item) => {
                if (item.type === "icon") {
                    let iconSpan = document.createElement('span');
                    iconSpan.className = 'icon-item';
                    iconSpan.innerText = item.text;
                    iconSpan.style.animationDelay = `${globalIndex * 0.03}s`;
                    container.appendChild(iconSpan);
                    globalIndex++;
                } else {
                    let wordInnerSpan = document.createElement('span');
                    wordInnerSpan.className = 'word-wrapper';
                    
                    let word = item.text;
                    for (let i = 0; i < word.length; i++) {
                        let char = word.charAt(i);
                        let charSpan = document.createElement('span');
                        charSpan.className = 'rain-char';
                        charSpan.innerText = char;
                        // Fast drop stagger delay (0.03s per character)
                        charSpan.style.animationDelay = `${globalIndex * 0.03}s, ${globalIndex * 0.05}s`;
                        
                        wordInnerSpan.appendChild(charSpan);
                        globalIndex++;
                    }
                    container.appendChild(wordInnerSpan);
                }
            });

            if (lineIndex < lines.length - 1) {
                let br = document.createElement('div');
                br.className = 'line-break';
                container.appendChild(br);
            }
        });

        // Reveal enter button precisely after letters finish dropping
        let totalTimeMs = (globalIndex * 30) + 300;
        setTimeout(() => {
            document.getElementById('btn-next-step').classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
