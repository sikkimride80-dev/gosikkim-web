<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Electronics - Gateway</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .phone-frame {
            width: 375px; /* Adjust width as needed for frame */
            height: 812px; /* Adjust height as needed for frame */
            background: #000;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Phone Header */
        .phone-header {
            height: 50px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            color: white;
            position: relative;
            z-index: 10;
        }
        .time { font-size: 14px; font-weight: 600; }
        .battery { font-size: 12px; }

        /* Browser Header */
        .browser-header {
            height: 50px;
            padding: 0 16px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: relative;
            z-index: 10;
        }
        .url-bar { font-size: 14px; color: #aaa; text-align: center; flex: 1; }
        .control-btns { display: flex; gap: 10px; font-size: 16px; color: #fff; }

        /* Content Area */
        .content-area {
            flex: 1;
            background-color: #111;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; /* Base for content absolute positioning */
        }

        /* Poor Signal Bar */
        .poor-signal {
            font-size: 12px;
            color: #ff6b6b;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }
        .poor-signal::before { content: '⏱️'; }

        /* Site Header */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
            color: white;
        }
        .brand-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 10px gold;
        }
        .brand-name img { width: 24px; height: 24px; }
        .language-selector { font-size: 12px; color: gold; display: flex; align-items: center; gap: 4px; }

        /* Image Display */
        .main-image-display {
            width: 100%;
            max-width: 343px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 300px; /* Space for the bottom zone */
            position: relative;
        }
        .main-image-display img {
            width: 100%;
            height: auto;
            display: block;
        }
        .starburst-icon {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        /* Go Button Container */
        .go-button-container {
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative; /* for centering the button over black zone */
            z-index: 5; /* Above black zone content */
        }
        .go-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #4dabf7, #69db7c);
            color: white;
            font-size: 24px;
            font-weight: 800;
            border: 4px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .go-button:active { transform: scale(0.95); }

        /* === Funny Stickers ONLY in Black Zone Area === */
        /* These are placed behind the center card, in the black space */
        .sticker {
            position: absolute;
            font-size: 40px; /* Fun size */
            opacity: 0.9;
            z-index: 0; /* Behind other content elements like headers and images */
        }

        /* Specific positions for stickers in the black zone */
        .sticker-1 { top: 70px; left: 10%; } /* Near poor signal */
        .sticker-2 { top: 120px; right: 5%; } /* Near site header */
        .sticker-3 { top: 200px; left: 5%; } /* Mid-left */
        .sticker-4 { top: 300px; right: 10%; } /* Mid-right */
        .sticker-5 { bottom: 180px; left: 10%; } /* Bottom-left of card space */
        .sticker-6 { bottom: 220px; right: 5%; } /* Bottom-right of card space */
        .sticker-7 { bottom: 70px; left: 15%; } /* Below card, left of button */
        .sticker-8 { bottom: 100px; right: 15%; } /* Below card, right of button */

    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="phone-header">
            <span class="time">9:41 AM</span>
            <span class="battery">100% 🔋</span>
        </div>
        <div class="browser-header">
            <span class="url-bar">gosikkim-web.vercel.app</span>
            <div class="control-btns">
                <span>⊕</span>
                <span>⑧</span>
                <span>⁝</span>
            </div>
        </div>
        <div class="content-area">
            <!-- Funny Stickers added in the background black zone -->
            <div class="sticker sticker-1">🤪</div>
            <div class="sticker sticker-2">😂</div>
            <div class="sticker sticker-3">🤡</div>
            <div class="sticker sticker-4">👀</div>
            <div class="sticker sticker-5">💃</div>
            <div class="sticker sticker-6">🚀</div>
            <div class="sticker sticker-7">💥</div>
            <div class="sticker sticker-8">🤔</div>

            <div class="poor-signal">POOR</div>

            <div class="site-header">
                <div class="brand-name">
                    <img src="https://img.icons8.com/plasticine/100/null/electrical-plug.png" alt="plug icon">
                    RAI ELECTRONICS
                </div>
                <div class="language-selector">English <span>▼</span></div>
            </div>

            <div class="main-image-display">
                <!-- Main scene card image with starburst icon -->
                <img src="https://catbox.moe/k2r8b4.jpg" alt="Rai Electronics Image Display">
                <img src="https://img.icons8.com/fluency/100/null/starburst.png" class="starburst-icon" alt="starburst icon">
            </div>

            <div class="go-button-container">
                <button class="go-button">GO</button>
            </div>
        </div>
    </div>
</body>
</html>
