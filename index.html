<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Text Only Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0e0e0e;color:#fff;touch-action:manipulation}
header{padding:10px;display:flex;gap:6px;justify-content:space-between;position:sticky;top:0;background:#111;z-index:100}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700}
.white{background:#fff;color:#000}
.dark{background:#2a2a2a;color:#fff}
#uploadBox{border:2px dashed #444;padding:30px;text-align:center;border-radius:14px;margin:10px}
#canvasWrap{position:relative;margin:10px;overflow:auto;border-radius:12px;background:#000;min-height:200px}
#canvas{display:block;width:100%}
#tapHint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:12px;pointer-events:none}
.text-line{background:#1e1e1e;border:1px solid #333;padding:10px;border-radius:12px;display:flex;align-items:center;gap:8px;margin:8px 10px}
.text-line input{flex:1;background:#000;color:#fff;border:1px solid #444;padding:8px;border-radius:8px}
.small{padding:8px 10px;border-radius:8px;border:none;font-weight:700;font-size:12px}
.edit{background:#fff;color:#000}
.del{background:#ff3b3b;color:#fff}
.save{margin:10px;width:calc(100% - 20px);padding:14px;background:#fff;color:#000;border-radius:12px;font-weight:800;border:none}
#status{text-align:center;font-size:12px;opacity:.6;margin:8px}
</style>
</head>
<body>
<header>
<div style="font-size:13px">✏️ Edit Text Only • 19MB</div>
<button class="btn dark" onclick="file.click()">Upload</button>
<button class="btn white" onclick="save()">Save to Gallery</button>
</header>

<div id="uploadBox" onclick="file.click()">
<input type="file" id="file" accept="image/*" hidden>
<b>+ Upload Photo</b><br><small>Max 19MB - JPG PNG WEBP - Tap photo to add text</small>
<div id="status">0.55MB ready</div>
</div>

<div id="canvasWrap" style="display:none">
<canvas id="canvas"></canvas>
<div id="tapHint">👆 Tap on text in photo to add edit box</div>
</div>

<button id="detectBtn" class="btn dark" style="margin:10px;width:calc(100% - 20px);display:none" onclick="detectText()">🔍 Auto Detect Text (may take 10s)</button>

<div id="list"></div>

<button class="save" style="display:none" id="saveBtn" onclick="save()">💾 Save Edited Photo to Phone</button>

<script>
const file=document.getElementById('file');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('canvasWrap');
const listEl=document.getElementById('list');
const statusEl=document.getElementById('status');
let img=null;
let texts=[];

file.addEventListener('change',e=>{
 const f=e.target.files[0];
 if(!f) return;
 if(f.size>19*1024*1024){alert('Max 19MB');return;}
 const r=new FileReader();
 r.onload=ev=>{
  const im=new Image();
  im.onload=()=>{
   img=im;
   canvas.width=im.width;
   canvas.height=im.height;
   wrap.style.display='block';
   document.getElementById('detectBtn').style.display='block';
   document.getElementById('saveBtn').style.display='block';
   ctx.drawImage(im,0,0);
   texts=[];
   render();
   statusEl.innerText=`${f.name} ${(f.size/1024/1024).toFixed(2)}MB - Now tap on photo where text is`;
  };
  im.src=ev.target.result;
 };
 r.readAsDataURL(f);
});

// TAP TO ADD TEXT - THIS FIXES YOUR ISSUE
canvas.addEventListener('click',e=>{
 if(!img) return;
 const rect=canvas.getBoundingClientRect();
 const scaleX=canvas.width/rect.width;
 const scaleY=canvas.height/rect.height;
 const x=(e.clientX-rect.left)*scaleX;
 const y=(e.clientY-rect.top)*scaleY;
 const newText=prompt('Enter text to place here:','');
 if(!newText) return;
 texts.push({x:x-20,y:y-10,w:200,h:28,newText:newText,oldText:''});
 render(); redraw();
});

function render(){
 listEl.innerHTML=texts.map((t,i)=>`
  <div class="text-line">
   <b>${i+1}.</b>
   <input value="${t.newText.replace(/"/g,'&quot;')}" oninput="texts[${i}].newText=this.value; redraw()" placeholder="Edit text">
   <button class="small edit" onclick="editIdx(${i})">Edit</button>
   <button class="small del" onclick="delIdx(${i})">Delete</button>
  </div>
 `).join('');
}
function editIdx(i){
 const v=prompt('Edit text:',texts[i].newText);
 if(v!==null){texts[i].newText=v; render(); redraw();}
}
function delIdx(i){texts.splice(i,1); render(); redraw();}

function redraw(){
 if(!img) return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,0,0);
 texts.forEach(t=>{
   // erase old area
   const bg=getBg(t.x,t.y);
   ctx.fillStyle=bg;
   ctx.fillRect(t.x-2,t.y-4,t.w+10,t.h+10);
   ctx.fillStyle= isDark(bg)?'#fff':'#00ff00';
   // game chat is usually white/green
   if(t.newText.includes(':')) ctx.fillStyle='#fff';
   ctx.font=`bold ${Math.max(14,t.h)}px Arial`;
   ctx.textBaseline='top';
   ctx.fillText(t.newText,t.x,t.y);
 });
}

async function detectText(){
 statusEl.innerText='Detecting... 5-10 sec, please wait';
 try{
  const {data}=await Tesseract.recognize(canvas.toDataURL(),'eng');
  const lines=data.lines.filter(l=>l.text.trim().length>2);
  lines.forEach(l=>{
   texts.push({x:l.bbox.x0,y:l.bbox.y0,w:l.bbox.x1-l.bbox.x0,h:l.bbox.y1-l.bbox.y0,newText:l.text.trim(),oldText:l.text.trim()});
  });
  statusEl.innerText=`Found ${lines.length} lines. Tap photo to add more if missed.`;
  render(); redraw();
 }catch(e){
  statusEl.innerText='Auto detect failed - just tap on photo to add text manually, that works 100%';
 }
}

function getBg(x,y){
 try{
  const d=ctx.getImageData(Math.max(0,x-2),Math.max(0,y-2),1,1).data;
  return `rgb(${d[0]},${d[1]},${d[2]})`;
 }catch(e){return 'rgb(0,0,0)'}
}
function isDark(c){const m=c.match(/\d+/g);return m&&((+m[0]+ +m[1]+ +m[2])/3<100);}

function save(){
 if(!img){alert('Upload first');return;}
 const a=document.createElement('a');
 a.download=`edited_${Date.now()}.jpg`;
 a.href=canvas.toDataURL('image/jpeg',0.92);
 a.click();
 statusEl.innerText='Saved to Downloads / Gallery';
}
</script>
</body>
</html>
