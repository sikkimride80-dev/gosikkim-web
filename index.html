<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikkim Daily Hour - Ultra Bright SKM Colors 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030712;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            perspective: 1200px;
        }

        /* Interactive 3D Stage */
        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            cursor: grab;
        }

        .stage:active {
            cursor: grabbing;
        }

        /* Full Background Immersive 3D Monolith */
        .object-3d {
            position: relative;
            width: 360px;
            height: 600px;
            background: #000000;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.8rem;
            transform-style: preserve-3d;
            transform: rotateX(12deg) rotateY(-16deg);
            box-shadow: 
                -30px 40px 70px rgba(0, 0, 0, 0.95),
                0 0 60px rgba(255, 102, 0, 0.4),
                inset 0 2px 5px rgba(255, 255, 255, 0.3),
                inset 0 -10px 30px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: transform 0.1s ease-out;
            user-select: none;
        }

        /* Full Background Landscape (crystal clear) */
        .bg-landscape {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.85) contrast(1.15) saturate(1.1);
        }

        .edge-vignette {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(3,7,18,0.4) 0%, transparent 25%, transparent 75%, rgba(3,7,18,0.5) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Glass Reflection Effect */
        .object-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.12), transparent);
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            pointer-events: none;
            z-index: 5;
        }

        .layer-top {
            position: relative;
            z-index: 5;
            transform: translateZ(35px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        /* Ultra Bright & Vivid Solid Neon-Grade SKM Flag Colors */
        .layer-center {
            position: relative;
            z-index: 5;
            transform: translateZ(85px);
            text-align: center;
        }

        .skm-3d-title {
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: 2px;
            text-transform: uppercase;
            
            /* High-luminosity neon-vibrant SKM Red/Orange spectrum */
            background: linear-gradient(135deg, #ff5500 0%, #ff0033 50%, #00ff66 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Maximum contrast dark backdrop shadows + glowing rims for absolute visibility */
            text-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.9),
                0 2px 0 #8b0000,
                0 3px 0 #500000,
                0 4px 0 #200000,
                0 12px 25px rgba(0, 0, 0, 1),
                0 0 35px rgba(255, 85, 0, 0.9);
            
            filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.95));
            padding: 0.2rem 0;
        }

        .skm-3d-title span {
            background: linear-gradient(135deg, #ff7700, #ff1a40, #1aff75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.9),
                0 2px 0 #990000,
                0 3px 0 #600000,
                0 4px 0 #300000,
                0 12px 25px rgba(0, 0, 0, 1),
                0 0 40px rgba(0, 255, 102, 0.9);
        }

        .layer-bottom {
            position: relative;
            z-index: 5;
            transform: translateZ(45px);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff5500, #cc3300);
            backdrop-filter: blur(10px);
            color: white;
            border: none;
            padding: 0.9rem;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 85, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #ff7700, #ff5500);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="stage" id="stage">
        <div class="object-3d" id="object3d">
            <!-- Full crystal clear background landscape -->
            <img class="bg-landscape" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Sikkim landscape mountains hills and roads">
            
            <div class="edge-vignette"></div>

            <div class="layer-top">
                <span>No Limit</span>
                <div class="live-dot"></div>
            </div>
            
            <div class="layer-center">
                <div class="skm-3d-title">
                    Sikkim<br>
                    <span>Daily Hour</span>
                </div>
            </div>

            <div class="layer-bottom">
                <button class="action-btn" onclick="event.stopPropagation(); alert('Sikkim Daily Hour: Ultra Bright SKM Active.');">Initialize</button>
            </div>
        </div>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const object3d = document.getElementById('object3d');

        let isDragging = false;
        let startX, startY;
        let rotX = 12;
        let rotY = -16;

        stage.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            stage.setPointerCapture(e.pointerId);
        });

        stage.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            rotY += deltaX * 0.5;
            rotX -= deltaY * 0.5;
            
            object3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            startX = e.clientX;
            startY = e.clientY;
        });

        stage.addEventListener('pointerup', (e) => {
            isDragging = false;
            stage.releasePointerCapture(e.pointerId);
        });
    </script>
</body>
</html>
