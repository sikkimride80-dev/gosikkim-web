<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Electronics - Step 1: Cinematic Intro</title>
    <style>
        @keyframes panZoom {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.15) translate(-10px, -10px); }
            100% { transform: scale(1) translate(0, 0); }
        }

        @keyframes ultraBrightGlow {
            0% { color: #ff0055; text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 50px #ff0055; }
            33% { color: #00ffcc; text-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc, 0 0 50px #00ffcc; }
            66% { color: #ffff00; text-shadow: 0 0 15px #ffff00, 0 0 30px #ffff00, 0 0 50px #ffff00; }
            100% { color: #ff0055; text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 50px #ff0055; }
        }

        @keyframes letterRainDrop {
            0% { opacity: 0; transform: translateY(-35px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        :root {
            --bg-deep: #050110;
            --glass-bg: rgba(15, 8, 35, 0.95);
            --neon-pink: #ff0055;
            --neon-cyan: #00ffcc;
            --neon-yellow: #ffff00;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1042, var(--bg-deep) 75%);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            padding: 30px 24px;
            border-radius: 32px;
            border: 3px solid var(--neon-yellow);
            box-shadow: 0 0 45px rgba(255, 255, 0, 0.45);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        /* Cinematic Background with 2.0x Pan Zoom Effect */
        .cinematic-bg {
            position: absolute;
            top: -30px; left: -30px; right: -30px; bottom: -30px;
            background: radial-gradient(circle, rgba(255,0,85,0.3) 0%, rgba(0,255,204,0.25) 50%, rgba(5,1,16,0.95) 100%);
            animation: panZoom 3s infinite ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        .rain-text-container {
            position: relative;
            z-index: 2;
            font-size: 20px;
            font-weight: 900;
            line-height: 2.2;
            max-width: 460px;
            margin: 0 auto;
            white-space: pre-wrap;
            animation: ultraBrightGlow 3s infinite linear;
            letter-spacing: 1px;
        }

        .rain-char {
            display: inline-block;
            opacity: 0;
            animation: letterRainDrop 0.08s forwards;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-yellow), var(--neon-pink));
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.5);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(255, 255, 0, 0.6); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="cinematic-bg"></div>
    
    <!-- Rain Text Container -->
    <div id="rain-text-output" class="rain-text-container"></div>

    <!-- Enter Button (Appears only after rain finishes) -->
    <button class="btn hidden" id="btn-next-step" onclick="alert('Step 1 Intro Complete! Ready for Step 2.')">Enter Rai Electronics Store 🚀</button>
</div>

<script>
    const introText = "Welcome to Rai Electronics\n\nWe offer you the most discounted prices\n\nYou can buy every electronic item here\n\nPlease Enjoy Your Visit\n\nFounder : Uttam Rai";
    
    function startRainIntro() {
        let container = document.getElementById('rain-text-output');
        container.innerHTML = "";
        let charIndex = 0;
        
        // 1.8x speed boost (18ms interval per character)
        let delayTimer = setInterval(() => {
            if (charIndex < introText.length) {
                let char = introText.charAt(charIndex);
                let span = document.createElement('span');
                span.className = 'rain-char';
                span.style.animationDelay = `${charIndex * 0.018}s`;
                
                if (char === '\n') {
                    span.innerHTML = '<br>';
                } else if (char === ' ') {
                    span.innerHTML = '&nbsp;'; // Preserves explicit spaces correctly
                } else {
                    span.innerHTML = char;
                }
                
                container.appendChild(span);
                charIndex++;
            } else {
                clearInterval(delayTimer);
                // Reveal button strictly after all letters drop
                document.getElementById('btn-next-step').classList.remove('hidden');
            }
        }, 18);
    }

    window.onload = function() {
        startRainIntro();
    };
</script>

</body>
</html>
