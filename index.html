<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rai Electronics - Flagship Experience</title>
    <style>
        :root {
            --accent-gold: #ffd700;
            --accent-cyan: #00f3ff;
            --accent-green: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Fixed Background Image in Screen Center */
        .center-bg-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: url('https://files.catbox.moe/lcxrp2.jpg') no-repeat center center;
            background-size: contain;
            z-index: 1;
            pointer-events: none;
        }

        /* Content Containers Positioned Above and Below Image */
        .top-section {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 16px 20px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .bottom-section {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 0 20px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Language Switcher Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .lang-select {
            background: rgba(20, 20, 20, 0.9);
            color: var(--accent-gold);
            border: 1px solid rgba(255, 215, 0, 0.6);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .lang-select option {
            background: #000000;
            color: #ffffff;
        }

        /* Header Title above Image */
        .header-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            letter-spacing: 1px;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* GO Gate overlay placed strictly in the top/bottom bleeding zones */
        .gate-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 24px 20px;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .go-btn {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff0055, #00f3ff);
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            border: 2px solid #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            transition: transform 0.2s ease;
        }

        .go-btn:active {
            transform: scale(0.92);
        }

        /* Text container above & below image */
        .text-top-container {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.5;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .text-bottom-container {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.6;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes smoothLineReveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 10px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .intro-line {
            opacity: 0;
            will-change: transform, opacity;
            animation: smoothLineReveal 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .founder-line {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
            font-size: 15px;
            margin-bottom: 12px;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ff0055 50%, #00f3ff 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .lang-btn {
            background: rgba(20, 20, 20, 0.9);
            border: 1.5px solid var(--accent-gold);
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <!-- Central Image (Unblocked) -->
    <div class="center-bg-image"></div>

    <!-- 1. GO Gate (Outside Image Area) -->
    <div id="go-gate" class="gate-overlay">
        <div class="top-section">
            <div class="header-title">🔌 RAI ELECTRONICS</div>
            <div class="header-subtitle">Flagship Digital Experience</div>
        </div>
        <div class="bottom-section">
            <button class="go-btn" onclick="pressGo()">GO</button>
        </div>
    </div>

    <!-- 2. Language Gate (Outside Image Area) -->
    <div id="lang-gate" class="gate-overlay hidden">
        <div class="top-section">
            <div class="header-title" style="font-size: 20px;">Select Language</div>
            <div class="header-subtitle" style="color: var(--accent-green); font-size: 12px; margin-top: 4px;">कृपया भाषा चयन गर्नुहोस् / भाषा चुनें</div>
        </div>
        <div class="bottom-section" style="max-width: 320px;">
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('ne')">नेपाली (Nepali)</button>
            <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी (Hindi)</button>
        </div>
    </div>

    <!-- 3. Dashboard Interface (Above and Below Image) -->
    <div class="top-section">
        <div class="top-bar">
            <select id="switcher" class="lang-select" onchange="switchAppLanguage(this.value)">
                <option value="en">English</option>
                <option value="ne">नेपाली</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>
        <div id="text-top-output" class="text-top-container"></div>
    </div>

    <div class="bottom-section">
        <div id="text-bottom-output" class="text-bottom-container"></div>
        <button class="btn-action hidden" id="btn-next-step" onclick="alert(translations[currentLang].alertText)">Enter Rai Electronics 🚀</button>
    </div>

<script>
    const translations = {
        en: {
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Step 1 Complete! Ready for Step 2.",
            topLines: [
                "Welcome to Rai Electronics"
            ],
            bottomLines: [
                "We offer you the most discounted prices",
                "You can buy every electronic item here",
                "Please Enjoy Your Visit",
                "🌹 🙏 Founder : Uttam Rai 🙏 🌹"
            ]
        },
        ne: {
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "चरण १ पूरा भयो! चरण २ का लागि तयार।",
            topLines: [
                "राई इलेक्ट्रोनिक्समा स्वागत छ"
            ],
            bottomLines: [
                "हामी तपाईंलाई सहुलियत मूल्यमा सामान दिन्छौं",
                "तपाईं यहाँ सबै इलेक्ट्रोनिक सामान किन्न सक्नुहुन्छ",
                "कृपया तपाईंको भ्रमणको आनन्द लिनुहोस्",
                "🌹 🙏 संस्थापक : उत्तम राई 🙏 🌹"
            ]
        },
        hi: {
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "चरण 1 पूर्ण! चरण 2 के लिए तैयार।",
            topLines: [
                "राई इलेक्ट्रॉनिक्स में स्वागत है"
            ],
            bottomLines: [
                "हम आपको सबसे अच्छी छूट पर सामान देते हैं",
                "आप यहाँ हर इलेक्ट्रॉनिक आइटम खरीद सकते हैं",
                "कृपया अपनी यात्रा का आनंद लें",
                "🌹 🙏 संस्थापक : उत्तम राय 🙏 🌹"
            ]
        }
    };

    let currentLang = 'en';

    function pressGo() {
        let goGate = document.getElementById('go-gate');
        goGate.classList.add('hidden');

        setTimeout(() => {
            let savedLang = localStorage.getItem('rai_preferred_lang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                document.getElementById('switcher').value = currentLang;
                startExperience();
            } else {
                document.getElementById('lang-gate').classList.remove('hidden');
            }
        }, 200);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        let langGate = document.getElementById('lang-gate');
        langGate.classList.add('hidden');

        setTimeout(() => {
            startExperience();
        }, 200);
    }

    function switchAppLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        startExperience();
    }

    function startExperience() {
        let topContainer = document.getElementById('text-top-output');
        let bottomContainer = document.getElementById('text-bottom-output');
        let btn = document.getElementById('btn-next-step');
        
        topContainer.innerHTML = "";
        bottomContainer.innerHTML = "";
        btn.classList.add('hidden');
        btn.innerText = translations[currentLang].btnText;

        let topLines = translations[currentLang].topLines;
        let bottomLines = translations[currentLang].bottomLines;

        // Render Top Lines above image
        topLines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = 'intro-line';
            div.style.color = '#ffd700';
            div.innerText = lineText;
            div.style.animationDelay = `${index * 0.15}s`;
            topContainer.appendChild(div);
        });

        // Render Bottom Lines below image
        bottomLines.forEach((lineText, index) => {
            let div = document.createElement('div');
            div.className = index === bottomLines.length - 1 ? 'intro-line founder-line' : 'intro-line';
            div.innerText = lineText;
            div.style.animationDelay = `${(topLines.length + index) * 0.15}s`;
            bottomContainer.appendChild(div);
        });

        let totalTimeMs = ((topLines.length + bottomLines.length) * 150) + 150;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
