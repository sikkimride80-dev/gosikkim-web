<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Text Only</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0e0e0e;color:#fff}
header{padding:12px;background:#1a1a1a;display:flex;gap:8px;justify-content:space-between;align-items:center;position:sticky;top:0}
.btn{padding:10px 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-white{background:#fff;color:#000}
.btn-dark{background:#2a2a2a;color:#fff}
.main{padding:15px;max-width:900px;margin:auto}
#canvas{width:100%;border-radius:12px;display:none;background:#000;margin:15px 0}
#uploadBox{border:2px dashed #333;padding:40px;border-radius:16px;text-align:center;cursor:pointer}
.text-line{background:#1c1c1c;border:1px solid #2a2a2a;padding:10px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.text-line span{flex:1;font-size:14px;word-break:break-all}
.small-btn{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:12px}
.edit{background:#fff;color:#000}
.del{background:#ff2a2a;color:#fff}
.save-big{width:100%;padding:14px;background:#fff;color:#000;border-radius:14px;font-weight:800;font-size:16px;margin-top:15px;border:none}
#status{font-size:12px;opacity:.6;margin-top:8px;text-align:center}
</style>
</head>
<body>
<header>
<div>✏️ Edit Text Only • 19MB</div>
<div style="display:flex;gap:6px">
<button class="btn btn-dark" onclick="document.getElementById('file').click()">Upload</button>
<button class="btn btn-white" onclick="saveToPhone()">Save to Gallery</button>
</div>
</header>

<div class="main">
<div id="uploadBox" onclick="document.getElementById('file').click()">
<input type="file" id="file" accept="image/*" hidden>
+<br><b>Upload Photo</b><br><small>Max 19MB - JPG PNG WEBP</small>
<div id="status"></div>
</div>

<canvas id="canvas"></canvas>

<button id="detectBtn" style="display:none;width:100%;padding:12px;background:#2a2a2a;color:#fff;border-radius:12px;border:none;margin-bottom:12px" onclick="detectText()">🔍 Detect Text in Photo</button>

<div id="textList"></div>

<button id="saveBtn" class="save-big" style="display:none" onclick="saveToPhone()">💾 Save Edited Photo to Phone</button>
</div>

<script>
const fileInput=document.getElementById('file');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const textList=document.getElementById('textList');
let img=null;
let texts=[];

fileInput.addEventListener('change',e=>{
 const f=e.target.files[0];
 if(!f) return;
 if(f.size>19*1024*1024){alert('Max 19MB');return;}
 const r=new FileReader();
 r.onload=ev=>{
  const im=new Image();
  im.onload=()=>{
   img=im;
   canvas.width=im.width;
   canvas.height=im.height;
   canvas.style.display='block';
   document.getElementById('detectBtn').style.display='block';
   document.getElementById('saveBtn').style.display='block';
   ctx.drawImage(im,0,0);
   texts=[];
   textList.innerHTML='';
   document.getElementById('status').innerHTML=f.name+' '+(f.size/1024/1024).toFixed(2)+'MB';
  };
  im.src=ev.target.result;
 };
 r.readAsDataURL(f);
});

async function detectText(){
 if(!img){alert('Upload first');return;}
 document.getElementById('status').innerText='Detecting text... wait 5-10 sec';
 const {data} = await Tesseract.recognize(canvas.toDataURL(),'eng');
 texts = data.lines.map(l=>({
  text:l.text.trim(),
  x:l.bbox.x0, y:l.bbox.y0, w:l.bbox.x1-l.bbox.x0, h:l.bbox.y1-l.bbox.y0,
  newText:l.text.trim()
 })).filter(t=>t.text.length>1);
 if(texts.length==0){document.getElementById('status').innerText='No text found';return;}
 document.getElementById('status').innerText=`Found ${texts.length} text lines`;
 render();
 redraw();
}

function render(){
 textList.innerHTML=texts.map((t,i)=>`
  <div class="text-line">
   <span><b>${i+1}.</b> ${t.newText}</span>
   <button class="small-btn edit" onclick="editLine(${i})">Edit</button>
   <button class="small-btn del" onclick="deleteLine(${i})">Delete</button>
  </div>
 `).join('');
}

function editLine(i){
 const val=prompt('Edit text:',texts[i].newText);
 if(val!==null){texts[i].newText=val; render(); redraw();}
}
function deleteLine(i){
 if(confirm('Delete this text from photo?')){texts.splice(i,1); render(); redraw();}
}

function redraw(){
 if(!img) return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,0,0);
 texts.forEach(t=>{
  // erase old with background color
  const bg = getBg(t.x,t.y);
  ctx.fillStyle=bg;
  ctx.fillRect(t.x-4,t.y-4,t.w+8,t.h+8);
  // write new
  ctx.fillStyle= isDark(bg)?'#fff':'#000';
  let fs = t.h*0.8;
  ctx.font=`bold ${fs}px Arial`;
  while(ctx.measureText(t.newText).width > t.w+20 && fs>10){fs--;ctx.font=`bold ${fs}px Arial`;}
  ctx.textBaseline='top';
  ctx.fillText(t.newText,t.x,t.y);
 });
}

function getBg(x,y){
 try{
  const d=ctx.getImageData(Math.max(0,x-5),Math.max(0,y-5),1,1).data;
  return `rgb(${d[0]},${d[1]},${d[2]})`;
 }catch(e){return '#000'}
}
function isDark(c){ const m=c.match(/\d+/g); if(!m) return false; return (parseInt(m[0])+parseInt(m[1])+parseInt(m[2]))/3 < 120; }

function saveToPhone(){
 if(!img){alert('Upload first');return;}
 const link=document.createElement('a');
 link.download=`edited_${Date.now()}.png`;
 link.href=canvas.toDataURL('image/png');
 link.click();
 // also save to localStorage gallery
 const gal=JSON.parse(localStorage.getItem('gallery')||'[]');
 gal.unshift(link.href);
 localStorage.setItem('gallery',JSON.stringify(gal.slice(0,20)));
 document.getElementById('status').innerText='Saved to phone gallery / Downloads';
}
</script>
</body>
</html>
