<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rai Electronics - Multilingual Intro</title>
    
    <!-- High-Performance Responsive Multilingual Text-To-Speech Engine -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>

    <style>
        :root {
            --bg-deep: #050110;
            --glass-bg: rgba(15, 8, 35, 0.98);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1042, var(--bg-deep) 75%);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            padding: 35px 24px;
            border-radius: 32px;
            border: 3px solid #ffff00;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.3);
            position: relative;
            text-align: center;
        }

        .rain-text-container {
            position: relative;
            z-index: 2;
            font-size: 19px;
            font-weight: 800;
            line-height: 2.2;
            max-width: 460px;
            margin: 0 auto;
            text-align: center;
        }

        .word-wrapper {
            display: inline-block;
            white-space: nowrap;
            margin-right: 6px;
        }

        .line-break {
            display: block;
            height: 10px;
        }

        @keyframes fastDrop {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes colorFlickerFast {
            0% { color: #ffff00; }   /* Yellow */
            20% { color: #00ff66; }  /* Green */
            40% { color: #00ccff; }  /* Blue */
            60% { color: #ff3333; }  /* Red */
            80% { color: #ff9900; }  /* Orange */
            100% { color: #cc33ff; } /* Purple */
        }

        .rain-char {
            display: inline-block;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDrop 0.15s ease-out forwards, colorFlickerFast 0.8s infinite linear;
        }

        .icon-item {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            opacity: 0;
            will-change: transform, opacity;
            animation: fastDrop 0.15s ease-out forwards;
            font-size: 22px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ffff00, #ff0055);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
            letter-spacing: 0.5px;
        }
        .btn:hover { transform: translateY(-2px); }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffff00;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .lang-btn:hover { background: #ffff00; color: #050110; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Language Selection Gate -->
<div id="lang-gate" style="position: fixed; inset: 0; background: rgba(5,1,16,0.98); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px; text-align: center;">
    <div style="font-size: 22px; font-weight: 900; color: #ffff00; margin-bottom: 8px;">🔌 Rai Electronics</div>
    <div style="font-size: 14px; color: #00ff66; margin-bottom: 25px; font-weight: 600;">Please select your preferred language / भाषा छान्नुहोस्</div>
    
    <div style="width: 100%; max-width: 300px;">
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('ne')">नेपाली (Nepali)</button>
        <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी (Hindi)</button>
    </div>
</div>

<!-- Main Container -->
<div class="app-container">
    <!-- Switcher Bar inside dashboard -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <select id="switcher" onchange="switchAppLanguage(this.value)" style="background: rgba(255,255,255,0.15); color: #ffff00; border: 1px solid #ffff00; padding: 6px 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">
            <option value="en" style="background:#050110;">English</option>
            <option value="ne" style="background:#050110;">नेपाली</option>
            <option value="hi" style="background:#050110;">हिन्दी</option>
        </select>
    </div>

    <div id="rain-text-output" class="rain-text-container"></div>
    <button class="btn hidden" id="btn-next-step" onclick="alert(translations[currentLang].alertText)">Enter Rai Electronics 🚀</button>
</div>

<script>
    const translations = {
        en: {
            speech: "Welcome to Rai Electronics. We offer you the most discounted prices. You can buy every electronic item here. Please enjoy your visit. Founder Uttam Rai.",
            rvVoice: "US English Female",
            btnText: "Enter Rai Electronics 🚀",
            alertText: "Step 1 Intro Complete! Ready for Step 2.",
            lines: [
                ["Welcome", "to", "Rai", "Electronics"],
                ["We", "offer", "you", "the", "most", "discounted", "prices"],
                ["You", "can", "buy", "every", "electronic", "item", "here"],
                ["Please", "Enjoy", "Your", "Visit"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "Founder" }, { type: "word", text: ":" },
                    { type: "word", text: "Uttam" }, { type: "word", text: "Rai" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        },
        ne: {
            speech: "राई इलेक्ट्रोनिक्समा स्वागत छ। हामी तपाईंलाई सबैभन्दा बढी छुट मूल्यहरू प्रदान गर्दछौं। तपाईं यहाँ हरेक इलेक्ट्रोनिक सामान किन्न सक्नुहुन्छ। तपाईंको भ्रमणको आनन्द लिनुहोस्। संस्थापक उत्तम राई।",
            rvVoice: "Hindi Female", // Nepali renders with high fidelity through Hindi accent speech engine
            btnText: "राई इलेक्ट्रोनिक्समा प्रवेश गर्नुहोस् 🚀",
            alertText: "चरण १ पूरा भयो! चरण २ का लागि तयार.",
            lines: [
                ["राई", "इलेक्ट्रोनिक्समा", "स्वागत", "छ"],
                ["हामी", "तपाईंलाई", "सहुलियत", "मूल्यमा", "सामान", "दिन्छौं"],
                ["तपाईं", "यहाँ", "सबै", "इलेक्ट्रोनिक", "सामान", "किन्न", "सक्नुहुन्छ"],
                ["कृपया", "तपाईंको", "भ्रमणको", "आनन्द", "लिनुहोस्"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "संस्थापक" }, { type: "word", text: ":" },
                    { type: "word", text: "उत्तम" }, { type: "word", text: "राई" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        },
        hi: {
            speech: "राई इलेक्ट्रॉनिक्स में आपका स्वागत है। हम आपको सबसे कम कीमत पर सामान प्रदान करते हैं। आप यहाँ हर इलेक्ट्रॉनिक सामान खरीद सकते हैं। कृपया अपनी यात्रा का आनंद लें। संस्थापक उत्तम राय।",
            rvVoice: "Hindi Female",
            btnText: "राई इलेक्ट्रॉनिक्स स्टोर में प्रवेश करें 🚀",
            alertText: "चरण 1 परिचय पूर्ण! चरण 2 के लिए तैयार.",
            lines: [
                ["राई", "इलेक्ट्रॉनिक्स", "में", "स्वागत", "है"],
                ["हम", "आपको", "सबसे", "अच्छी", "छूट", "पर", "सामान", "देते", "हैं"],
                ["आप", "यहाँ", "हर", "इलेक्ट्रॉनिक", "आइटम", "खरीद", "सकते", "हैं"],
                ["कृपया", "अपनी", "यात्रा", "का", "आनंद", "लें"],
                { type: "founder", items: [
                    { type: "icon", text: "🌹" }, { type: "icon", text: "🙏" },
                    { type: "word", text: "संस्थापक" }, { type: "word", text: ":" },
                    { type: "word", text: "उत्तम" }, { type: "word", text: "राय" },
                    { type: "icon", text: "🙏" }, { type: "icon", text: "🌹" }
                ]}
            ]
        }
    };

    let currentLang = 'en';

    window.onload = function() {
        let savedLang = localStorage.getItem('rai_preferred_lang');
        if (savedLang && translations[savedLang]) {
            currentLang = savedLang;
            document.getElementById('lang-gate').style.display = 'none';
            document.getElementById('switcher').value = currentLang;
            startExperience();
        }
    };

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        document.getElementById('switcher').value = lang;
        
        let gate = document.getElementById('lang-gate');
        gate.style.opacity = '0';
        setTimeout(() => { gate.style.display = 'none'; }, 300);

        startExperience();
    }

    function switchAppLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('rai_preferred_lang', lang);
        if (window.responsiveVoice) window.responsiveVoice.cancel();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        startExperience();
    }

    function triggerVoiceNarration() {
        let textToSpeak = translations[currentLang].speech;
        let voiceName = translations[currentLang].rvVoice;

        // Try ResponsiveVoice engine first
        if (window.responsiveVoice && typeof window.responsiveVoice.speak === 'function') {
            window.responsiveVoice.cancel();
            window.responsiveVoice.speak(textToSpeak, voiceName, { rate: 0.95 });
        } 
        // Fallback to Native Speech Synthesis
        else if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = currentLang === 'en' ? 'en-US' : (currentLang === 'ne' ? 'ne-NP' : 'hi-IN');
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }
    }

    function startExperience() {
        // Trigger voice narration
        triggerVoiceNarration();

        // Render localized fast letter rain
        let container = document.getElementById('rain-text-output');
        container.innerHTML = "";
        let globalIndex = 0;
        let dataLines = translations[currentLang].lines;

        dataLines.forEach((lineData, lineIndex) => {
            let wordsInLine = [];
            if (Array.isArray(lineData)) {
                wordsInLine = lineData.map(w => ({ type: "word", text: w }));
            } else if (lineData.type === "founder") {
                wordsInLine = lineData.items;
            }

            let wordSpan = document.createElement('span');
            wordSpan.className = 'word-wrapper';

            wordsInLine.forEach((item) => {
                if (item.type === "icon") {
                    let iconSpan = document.createElement('span');
                    iconSpan.className = 'icon-item';
                    iconSpan.innerText = item.text;
                    iconSpan.style.animationDelay = `${globalIndex * 0.03}s`;
                    container.appendChild(iconSpan);
                    globalIndex++;
                } else {
                    let wordInnerSpan = document.createElement('span');
                    wordInnerSpan.className = 'word-wrapper';
                    
                    let word = item.text;
                    for (let i = 0; i < word.length; i++) {
                        let char = word.charAt(i);
                        let charSpan = document.createElement('span');
                        charSpan.className = 'rain-char';
                        charSpan.innerText = char;
                        charSpan.style.animationDelay = `${globalIndex * 0.03}s, ${globalIndex * 0.05}s`;
                        
                        wordInnerSpan.appendChild(charSpan);
                        globalIndex++;
                    }
                    container.appendChild(wordInnerSpan);
                }
            });

            if (lineIndex < dataLines.length - 1) {
                let br = document.createElement('div');
                br.className = 'line-break';
                container.appendChild(br);
            }
        });

        // Reveal enter button strictly after letters drop
        let btn = document.getElementById('btn-next-step');
        btn.innerText = translations[currentLang].btnText;
        btn.classList.add('hidden');

        let totalTimeMs = (globalIndex * 30) + 300;
        setTimeout(() => {
            btn.classList.remove('hidden');
        }, totalTimeMs);
    }
</script>

</body>
</html>
